<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<meta name="darkreader-lock" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Valdoria Map Variants</title>
<!--
  Valdoria haritası yerleşim TASLAKLARI (campaign-dev, 2026-10-10; Ömer seçimi için). Oyun kodu DEĞİL, oyun verisine dokunmaz.
  Belge: docs/design/campaign/valdoria-2x.md (bölüm 10 "Yayılmış varyantlar"). Sayfa canlı sefer haritasını taklit eder: dünya birimi
  (eski 16:9 harita bölgesi = 1920 x 1080), sahne yüksekliği 1080 birim, yakınlaştırma 1,0-1,4 (src/game/map-view.ts), düğüm yarıçapı 24
  (boss 30), boyalı düğüm ikonları (assets/misc-icons/node), ad 15 birim Cinzel, dokunma alanı 96 birim çap, HUD sütunları / üst bant /
  alt kontroller CampaignMapScene.renderHud ölçüleriyle. Yazı çakışmaları sayfada GERÇEK yazı genişliğiyle ölçülür (sağ üst köşe).
-->
<style>
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: block; src: url('valdoria-map/fonts/Cinzel-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400 800; font-display: block; src: url('valdoria-map/fonts/EBGaramond-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: block; src: url('valdoria-map/fonts/EBGaramond-italic-latin.woff2') format('woff2'); }
:root { color-scheme: dark; --gold: 217,178,106; --on: #f3d999; --txt: #d9c8a2; --muted: #a8977a; --dim: #7d705a; --ember: #e0702a; --ember2: #ffb35a;
  --cin: Cinzel, Georgia, serif; --gar: 'EB Garamond', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050403; color: var(--txt); font-family: var(--gar); overflow: hidden; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#map.drag { cursor: grabbing; }
.edge { fill: none; stroke: rgba(242,220,170,.8); stroke-width: 3; stroke-linecap: round; }
.edge.dash { stroke-dasharray: 10 9; }
.disc { fill: rgba(20,14,9,.95); stroke: rgba(var(--gold),.7); stroke-width: 1.5; }
.node.big .ring2 { fill: none; stroke: rgba(255,179,90,.7); stroke-width: 1; }
.node.new .disc { stroke: var(--ember2); stroke-width: 2.5; }
.lbl { font: 600 15px var(--cin); letter-spacing: .06em; text-transform: uppercase; fill: var(--txt); paint-order: stroke; stroke: rgba(8,5,3,.95); stroke-width: 5px; stroke-linejoin: round; }
.lblbg { fill: rgba(0,0,0,.42); }
.startTag { font: 600 12px var(--cin); letter-spacing: .2em; fill: var(--muted); paint-order: stroke; stroke: rgba(8,5,3,.9); stroke-width: 4px; }
.node { cursor: pointer; }
.node:hover .disc { stroke: var(--on); stroke-width: 2.5; }
.hit { fill: transparent; }
.showHit .hit { fill: rgba(120,200,255,.10); stroke: rgba(120,200,255,.45); stroke-width: 1; stroke-dasharray: 3 3; }
.coll .lblbox { fill: none; stroke: #ff4a3a; stroke-width: 2; }
.lblbox { fill: none; stroke: none; }
.phone .lbl { font-size: 24px; stroke-width: 7px; }
.phone .startTag { font-size: 18px; }
/* HUD taklidi (sahne birimi; JS ölçekler) */
#hud { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
#hud.off { display: none; }
.hud-shade { position: absolute; top: 0; }
.hud-panel { position: absolute; border: 1px solid rgba(var(--gold),.3); background: linear-gradient(180deg, rgba(24,17,11,.82), rgba(10,7,5,.82)); }
.hud-panel h5 { margin: 0; padding: 14px 18px 6px; font: 600 14px var(--cin); letter-spacing: .24em; color: rgba(var(--gold),.85); text-transform: uppercase; }
.hud-panel p { margin: 0; padding: 0 18px; font: italic 17px var(--gar); color: var(--muted); }
.hud-title { position: absolute; left: 48px; top: 22px; font: 600 30px var(--cin); letter-spacing: .12em; color: #fbe7b0; text-transform: uppercase; white-space: nowrap; }
.hud-title span { font: italic 19px var(--gar); letter-spacing: 0; color: var(--muted); text-transform: none; margin-left: 8px; }
.hud-ctrl { position: absolute; display: flex; gap: 12px; align-items: center; pointer-events: auto; }
.hud-ctrl button { all: unset; width: 52px; height: 52px; display: grid; place-items: center; cursor: pointer; font: 600 24px var(--cin); color: var(--on); border: 1px solid rgba(var(--gold),.4); background: rgba(10,7,5,.85); }
.hud-ctrl i { font: 600 12px var(--cin); letter-spacing: .24em; color: var(--dim); font-style: normal; width: 60px; text-align: center; }
.hud-menu { position: absolute; top: 18px; font: 600 16px var(--cin); letter-spacing: .14em; color: var(--txt); border: 1px solid rgba(var(--gold),.35); padding: 8px 16px; background: rgba(10,7,5,.7); }
/* Taslak araçları (oyunda yok): kor rengi çerçeve */
#bar { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 4px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
#bar button, #tools button { all: unset; cursor: pointer; padding: 7px 11px; font: 600 12px var(--cin); letter-spacing: .08em; color: var(--muted); background: rgba(10,7,5,.92); border: 1px solid rgba(255,179,90,.45); white-space: nowrap; }
#bar button.on, #tools button.on { color: #1a0f06; background: var(--ember); border-color: var(--ember2); }
#tools { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); display: flex; gap: 4px; z-index: 20; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); }
#stats { position: fixed; left: 8px; bottom: 8px; z-index: 20; padding: 8px 12px; background: rgba(10,7,5,.92); border: 1px solid rgba(255,179,90,.45); font-size: 14px; line-height: 1.35; max-width: 300px; }
#stats b { font: 600 11px var(--cin); letter-spacing: .14em; color: var(--on); }
#stats .bad { color: #ff7a63; } #stats .ok { color: #9ad08a; }
#stats small { color: var(--muted); }
#tip { position: fixed; pointer-events: none; z-index: 30; min-width: 200px; max-width: 320px; padding: 10px 14px; background: linear-gradient(180deg, rgba(30,22,14,.97), rgba(12,9,6,.97)); border: 1px solid rgba(var(--gold),.5); box-shadow: 0 10px 28px rgba(0,0,0,.6); display: none; }
#tip b { display: block; font: 600 16px var(--cin); letter-spacing: .06em; color: var(--on); }
#tip i { display: block; font-size: 15px; color: var(--muted); }
#tip span { display: block; font-size: 15px; margin-top: 4px; }
@media (max-width: 900px), (max-height: 500px) { #bar, #tools { gap: 2px; } #bar button, #tools button { padding: 3px 5px; font-size: 8px; letter-spacing: .02em; } #tools { top: 26px; } #stats { font-size: 9px; line-height: 1.25; max-width: 190px; padding: 4px 6px; } #stats small { display: none; } }
</style>
</head>

const META = {
  v1: { name: 'Current', note: "Today's live Valdoria (data/campaign/valdoria.json), positions as in the game." },
  v2: { name: 'Last proposal', note: '34-stop template from the first proposal, positions as proposed.' },
  v3: { name: 'Spread 34', note: 'Same 34 stops and routes as the last proposal, re-laid-out across the whole wide map.' },
  v4: { name: 'Spread ~25 A', note: '25 stops, 3 big choices (2 / 3 / 2 branches of 2 stops), rest point before the bridge boss, merchants in both late branches.' },
  v5: { name: 'Spread ~25 B', note: '25 stops, a main road with 7 small forks (two one-stop options that rejoin right away): more, smaller decisions.' },
};
const TYPE = { battle: 'Battle', elite: 'Elite', boss: 'Boss', town: 'Town', treasure: 'Treasure', event: 'Event', rest: 'Rest point', merchant: 'Merchant' };
// Dünya: eski 16:9 harita bölgesi = 0..1920 x 0..1080; geniş görsel bu bölgeye göre yerleşir (valdoria.json > backgroundWide.region)
const REG = [0.08229, 0.00077, 0.79804, 0.94083];
const IMG = { w: 1920 / (REG[2] - REG[0]), h: 1080 / (REG[3] - REG[1]) };
IMG.x = -REG[0] * IMG.w; IMG.y = -REG[1] * IMG.h;
const FRAME = { left: Math.min(0, IMG.x), right: Math.max(1920, IMG.x + IMG.w), top: Math.min(0, IMG.y), bottom: Math.max(1080, IMG.y + IMG.h) };
const NODE_R = 24, HIT = 48, ZMIN = 1, ZMAX = 1.4;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const el = (tag, attrs = {}, parent = svg) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.append(e); return e; };
const state = { v: (location.hash.match(/v[1-5]/) || ['v4'])[0], z: 1, mid: { x: 960, y: 540 }, overview: false, hud: true, phone: false, hit: false, coll: true };

// ---------------------------------------------------------------- çizim
let world, layer;
function draw() {
  svg.innerHTML = '';
  svg.classList.toggle('phone', state.phone);
  svg.classList.toggle('showHit', state.hit);
  world = el('g');
  el('image', { href: 'valdoria-map/map.webp', x: IMG.x, y: IMG.y, width: IMG.w, height: IMG.h, preserveAspectRatio: 'none' }, world);
  const V = VARIANTS[state.v];
  const by = Object.fromEntries(V.nodes.map((n) => [n.id, n]));
  const outN = {}, inN = {};
  for (const e of V.edges) { (outN[e.from] ??= []).push(e.to); (inN[e.to] ??= []).push(e.from); }
  const eg = el('g', {}, world);
  for (const e of V.edges) {
    const a = by[e.from].w, b = by[e.to].w;
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    let h = 0; for (const ch of e.from + '>' + e.to) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const bend = (h % 2 ? 1 : -1) * len * 0.1;
    const mx = (a[0] + b[0]) / 2 + (-dy / len) * bend, my = (a[1] + b[1]) / 2 + (dx / len) * bend;
    const branch = (outN[e.from]?.length ?? 0) > 1 || (inN[e.to]?.length ?? 0) > 1;
    el('path', { d: `M${a[0]} ${a[1]} Q${mx} ${my} ${b[0]} ${b[1]}`, class: `edge${branch ? ' dash' : ''}` }, eg);
  }
  const stop = stops(V);
  layer = el('g', {}, world);
  for (const n of V.nodes) {
    const big = n.type === 'boss';
    const r = NODE_R * (big ? 1.25 : 1);
    const isStart = n.id === V.start;
    const g = el('g', { class: `node${big ? ' big' : ''}${n.new ? ' new' : ''}`, transform: `translate(${n.w[0]} ${n.w[1]})` }, layer);
    el('circle', { class: 'hit', r: HIT }, g);
    el('circle', { cx: 2, cy: 4, r: r + 3, fill: 'rgba(0,0,0,.4)' }, g);
    el('circle', { class: 'disc', r }, g);
    if (big) el('circle', { class: 'ring2', r: r + 6 }, g);
    const icon = isStart ? 'start' : n.type;
    const s = r * 1.84;
    el('image', { href: `valdoria-map/icons/${icon}.png`, x: -s / 2, y: -s / 2, width: s, height: s }, g);
    const above = n.label === 'above';
    const fs = state.phone ? 24 : 15;
    const ly = above ? -r - 12 : r + 10 + fs * 0.82;
    const t = el('text', { class: 'lbl', x: 0, y: ly, 'text-anchor': 'middle' }, g);
    t.textContent = n.name;
    if (isStart) { const st = el('text', { class: 'startTag', x: 0, y: above ? -r - 14 - fs * 1.4 : -r - 10, 'text-anchor': 'middle' }, g); st.textContent = 'START'; }
    g.dataset.id = n.id;
    const show = (ev) => {
      tip.innerHTML = `<b>${n.name}</b><i>${TYPE[n.type]}${isStart ? ' · Start' : ''} · stop ${stop[n.id] ?? '?'}${n.new ? ' · NEW' : ''}</i><span>${n.sub || ''}</span>`;
      tip.style.display = 'block';
      const rr = tip.getBoundingClientRect();
      tip.style.left = Math.min(innerWidth - rr.width - 8, ev.clientX + 16) + 'px';
      tip.style.top = Math.min(innerHeight - rr.height - 8, ev.clientY + 16) + 'px';
    };
    g.addEventListener('pointerenter', show); g.addEventListener('pointermove', show);
    g.addEventListener('pointerleave', () => (tip.style.display = 'none'));
  }
  camera();
  requestAnimationFrame(() => { measure(); stats(); });
}

// Durak numarası: başlangıçtan en uzun yol (bütün rotalar eşit uzunlukta)
function stops(V) {
  const nxt = {}; for (const e of V.edges) (nxt[e.from] ??= []).push(e.to);
  const d = {}; const walk = (id, k) => { if ((d[id] ?? 0) >= k) return; d[id] = k; for (const m of nxt[id] ?? []) walk(m, k + 1); };
  walk(V.start, 1); return d;
}
function routes(V) {
  const nxt = {}; for (const e of V.edges) (nxt[e.from] ??= []).push(e.to);
  const lens = []; const walk = (id, k) => { if (!nxt[id]) { lens.push(k); return; } for (const m of nxt[id]) walk(m, k + 1); };
  walk(V.start, 1); return lens;
}
function decisions(V) { const c = {}; for (const e of V.edges) c[e.from] = (c[e.from] ?? 0) + 1; return Object.values(c).filter((x) => x > 1).length; }

// Gerçek yazı kutularıyla çakışma (dünya biriminde; yakınlaştırma / ekran oranından bağımsız)
let collCount = 0, minGap = 0;
function measure() {
  const items = [...layer.querySelectorAll('.node')].map((g) => {
    const t = g.querySelector('.lbl'); const bb = t.getBBox();
    const m = g.transform.baseVal.consolidate().matrix;
    return { g, x: m.e, y: m.f, lab: [m.e + bb.x - 4, m.f + bb.y, m.e + bb.x + bb.width + 4, m.f + bb.y + bb.height], bb };
  });
  const hitBox = (it) => [it.x - HIT, it.y - HIT, it.x + HIT, it.y + HIT];
  const inter = (a, b, p = 0) => !(a[2] + p <= b[0] || b[2] + p <= a[0] || a[3] + p <= b[1] || b[3] + p <= a[1]);
  const bad = new Set();
  collCount = 0; minGap = Infinity;
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const A = items[i], B = items[j];
    minGap = Math.min(minGap, Math.hypot(A.x - B.x, A.y - B.y));
    if (inter(A.lab, B.lab, 6) || inter(A.lab, hitBox(B)) || inter(hitBox(A), B.lab) || Math.hypot(A.x - B.x, A.y - B.y) < HIT * 2) { bad.add(A.g); bad.add(B.g); collCount++; }
  }
  for (const it of items) {
    it.g.querySelector('.lblbox')?.remove();
    const r = el('rect', { class: 'lblbox', x: it.bb.x - 4, y: it.bb.y, width: it.bb.width + 8, height: it.bb.height }, it.g);
    it.g.insertBefore(r, it.g.querySelector('.lbl'));
    it.g.classList.toggle('coll', state.coll && bad.has(it.g));
  }
}

// ---------------------------------------------------------------- kamera (canlı haritanın taklidi)
function stageScale() { return innerHeight / 1080; }
function viewSize() {
  if (state.overview) { const k = Math.min(innerWidth / (FRAME.right - FRAME.left), innerHeight / (FRAME.bottom - FRAME.top)); return { w: innerWidth / k, h: innerHeight / k }; }
  const s = stageScale(); return { w: innerWidth / s / state.z, h: 1080 / state.z };
}
function clampMid() {
  const v = viewSize();
  const cx = (FRAME.left + FRAME.right) / 2, cy = (FRAME.top + FRAME.bottom) / 2;
  const fx = v.w >= FRAME.right - FRAME.left, fy = v.h >= FRAME.bottom - FRAME.top;
  state.mid.x = fx ? cx : Math.min(FRAME.right - v.w / 2, Math.max(FRAME.left + v.w / 2, state.mid.x));
  state.mid.y = fy ? cy : Math.min(FRAME.bottom - v.h / 2, Math.max(FRAME.top + v.h / 2, state.mid.y));
}
function camera() {
  clampMid();
  const v = viewSize();
  svg.setAttribute('viewBox', `${state.mid.x - v.w / 2} ${state.mid.y - v.h / 2} ${v.w} ${v.h}`);
  layoutHud();
  stats();
}

// ---------------------------------------------------------------- HUD taklidi (CampaignMapScene.renderHud ölçüleri; sahne birimi)
const hud = document.getElementById('hud');
function layoutHud() {
  const s = stageScale();
  const W = innerWidth / s; // sahne genişliği (birim)
  hud.classList.toggle('off', !state.hud || state.overview);
  hud.style.width = W + 'px'; hud.style.height = '1080px';
  hud.style.transform = `scale(${s})`;
  const compact = innerHeight <= 720;
  const size = compact ? 92 : 52;
  const V = VARIANTS[state.v];
  hud.innerHTML = `
    <div class="hud-shade" style="left:0;width:620px;height:1080px;background:linear-gradient(90deg,rgba(8,6,4,.92),rgba(8,6,4,.7) 70%,rgba(8,6,4,0))"></div>
    <div class="hud-shade" style="left:${W - 640}px;width:640px;height:1080px;background:linear-gradient(90deg,rgba(8,6,4,0),rgba(8,6,4,.72) 22%,rgba(8,6,4,.93))"></div>
    <div class="hud-shade" style="left:0;width:${W}px;height:120px;background:linear-gradient(180deg,rgba(8,6,4,.85),rgba(8,6,4,0))"></div>
    <div class="hud-title">Valdoria<span>I · The Borderlands · Stop 1 / ${Math.max(...routes(V))} · Normal · Medium</span></div>
    <div class="hud-panel" style="left:48px;top:150px;width:420px;height:560px"><h5>Party</h5><p>Hero cards (live: renderParty)</p></div>
    <div class="hud-panel" style="left:${W - 48 - 440}px;top:${compact ? 215 : 150}px;width:440px;height:470px"><h5>Node card</h5><p>Selected stop, March / Fight (live: renderNodeCard)</p></div>
    <div class="hud-panel" style="left:${W - 48 - 300}px;top:${1080 - 24 - 48}px;width:300px;height:48px"><h5>Legend</h5></div>
    <div class="hud-menu" style="left:${W - 48 - 92}px">MENU</div>
    <div class="hud-ctrl" style="left:${960 - 60 - (size + 12) - size / 2}px;top:${1080 - 18 - size}px">
      <button data-a="l" style="width:${size}px;height:${size}px">◂</button><button data-a="r" style="width:${size}px;height:${size}px">▸</button><i>MAP</i>
      <button data-a="-" style="width:${size}px;height:${size}px">−</button><button data-a="+" style="width:${size}px;height:${size}px">+</button>
    </div>`;
  hud.querySelectorAll('button').forEach((b) => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const a = b.dataset.a;
    if (a === 'l') state.mid.x -= 360; if (a === 'r') state.mid.x += 360;
    if (a === '-') state.z = Math.max(ZMIN, +(state.z - 0.1).toFixed(2)); if (a === '+') state.z = Math.min(ZMAX, +(state.z + 0.1).toFixed(2));
    camera();
  }));
}

// ---------------------------------------------------------------- köşe: durak sayısı, karışım, ölçümler
function stats() {
  const V = VARIANTS[state.v];
  const cnt = (t) => V.nodes.filter((n) => n.type === t).length;
  const r = routes(V);
  const tapDesk = Math.round(HIT * 2 * stageScale() * (state.overview ? 1 : state.z));
  const phoneS = 390 / 1080;
  document.getElementById('stats').innerHTML =
    `<b>${META[state.v].name.toUpperCase()}</b><br><small>${META[state.v].note}</small><br>` +
    `<b>STOPS</b> ${V.nodes.length} on the map · <b>${Math.min(...r)}${Math.max(...r) !== Math.min(...r) ? '-' + Math.max(...r) : ''}</b> per run · ${r.length} routes · ${decisions(V)} choices<br>` +
    `<b>MIX</b> Battle ${cnt('battle')} · Elite ${cnt('elite')} · Boss ${cnt('boss')} · Town ${cnt('town')}<br>Event ${cnt('event')} · Treasure ${cnt('treasure')} · Rest ${cnt('rest')} · Merchant ${cnt('merchant')}<br>` +
    `<b>LABELS</b> <span class="${collCount ? 'bad' : 'ok'}">${collCount} collision${collCount === 1 ? '' : 's'}</span> (${state.phone ? 'phone 24' : 'desktop 15'} size) · min node gap ${Math.round(minGap)} u<br>` +
    `<b>TAP</b> here ${tapDesk} px at ${state.overview ? 'overview' : state.z.toFixed(1) + 'x'} · phone (390 px tall) ${Math.round(96 * phoneS)} px at 1.0x, ${Math.round(96 * phoneS * 1.4)} px at 1.4x`;
}

// ---------------------------------------------------------------- girdi
let dragging = null;
svg.addEventListener('pointerdown', (e) => { dragging = { x: e.clientX, y: e.clientY, mid: { ...state.mid } }; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const v = viewSize(); const k = v.w / innerWidth;
  state.mid.x = dragging.mid.x - (e.clientX - dragging.x) * k; state.mid.y = dragging.mid.y - (e.clientY - dragging.y) * k;
  camera();
});
const endDrag = () => { dragging = null; svg.classList.remove('drag'); };
svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey) state.z = Math.min(ZMAX, Math.max(ZMIN, +(state.z + (e.deltaY < 0 ? 0.1 : -0.1)).toFixed(2)));
  else { state.mid.x += (e.deltaX || e.deltaY); state.mid.y += e.deltaX ? e.deltaY : 0; }
  camera();
}, { passive: false });
addEventListener('resize', () => camera());
const tip = document.getElementById('tip');

const bar = document.getElementById('bar');
for (const k of Object.keys(META)) {
  const b = document.createElement('button'); b.textContent = `${k.slice(1)}. ${META[k].name}`; b.dataset.v = k;
  b.onclick = () => { state.v = k; history.replaceState(null, '', '#' + k); sync(); draw(); };
  bar.append(b);
}
const tools = document.getElementById('tools');
const toggles = [
  ['overview', 'Overview (not in game)'], ['hud', 'HUD overlay'], ['phone', 'Phone labels 24'], ['hit', 'Tap areas'], ['coll', 'Mark collisions'],
];
for (const [k, label] of toggles) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.k = k;
  b.onclick = () => { state[k] = !state[k]; sync(); if (k === 'phone' || k === 'hit') draw(); else if (k === 'coll') { measure(); stats(); } else camera(); };
  tools.append(b);
}
function sync() {
  bar.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.v));
  tools.querySelectorAll('button').forEach((b) => b.classList.toggle('on', !!state[b.dataset.k]));
}
sync();
document.fonts.ready.then(draw);
</script>
</body>
</html>
