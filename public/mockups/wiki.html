<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Codex Mockups</title>
<!--
  Wiki / Codex ekranı: 3 taslak (Ömer 2026-10-09). Oyun kodu DEĞİL; seçim için karşılaştırma sayfası. Açılış: mockups/wiki.html?v=1..3
  Dil: tasarım kiti (kit.css = src/ui/elegant.css kopyası). Veri gerçek (data.js: class'lar, skill açıklamaları, durumlar).
  Bölüm / madde seçimi çalışır (Classes, Statuses, Mechanics); diğer bölümler örnek başlıktır.
-->
<link rel="stylesheet" href="kit.css" />
<link rel="stylesheet" href="common.css" />
<style>
.bg { position: absolute; inset: 0; background: url('assets/img/castle-hall.webp') center 40% / cover; }
.bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,6,4,.9), rgba(8,6,4,.84) 40%, rgba(8,6,4,.94)); }
.navrow { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 6px; border-bottom: 1px solid var(--el-line1); cursor: pointer; font: 600 21px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-txt); text-shadow: var(--el-sh); transition: color .18s, text-shadow .18s; }
.navrow .el-dia { opacity: 0; transform: rotate(45deg) scale(.4); transition: all .18s var(--el-ease); }
.navrow span { transition: transform .18s var(--el-ease); }
.navrow small { margin-left: auto; font: italic 16px var(--el-body); color: var(--el-dim); text-transform: none; letter-spacing: 0; }
.navrow:hover, .navrow.on { color: var(--el-on); text-shadow: var(--el-glow); }
.navrow:hover span, .navrow.on span { transform: translateX(6px); }
.navrow.on .el-dia, .navrow:hover .el-dia { opacity: 1; transform: rotate(45deg) scale(1); }
.navrow.sub { min-height: 46px; font-size: 16px; padding-left: 30px; color: var(--el-muted); }
.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid var(--el-line2); background: rgba(8,6,4,.6); font: italic 19px var(--el-body); color: var(--el-dim); }
.search svg { width: 18px; height: 18px; stroke: var(--el-gold); fill: none; stroke-width: 2; }
.tile { position: relative; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform .25s var(--el-ease); }
.tile .pic { width: 120px; height: 120px; border: 1px solid var(--el-line2); overflow: hidden; background: #120c08; position: relative; }
.tile .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--el-ease); }
.tile .pic::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--g); opacity: .6; }
.tile span { font: 600 15px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-txt); }
.tile:hover { transform: translateY(-6px); } .tile:hover .pic { border-color: var(--el-gold); } .tile:hover .pic img { transform: scale(1.06); }
.tile.on .pic { border: 2px solid var(--el-on); } .tile.on span, .tile:hover span { color: var(--el-on); }
.art h1 { margin: 0; font: 600 46px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-on); line-height: 1.05; }
.art .role { font: italic 22px var(--el-body); color: var(--el-muted); margin: 4px 0 16px; }
.art p { margin: 10px 0; font-size: 21px; line-height: 1.38; color: var(--el-note); }
.art h3 { margin: 22px 0 6px; }
.attrs { display: flex; gap: 26px; padding: 10px 0; border-top: 1px solid var(--el-line1); border-bottom: 1px solid var(--el-line1); font: 600 22px var(--el-display); color: var(--el-txt); }
.attrs small { font: 600 13px var(--el-display); letter-spacing: .14em; color: var(--el-muted); margin-right: 6px; }
.attrs .pri { color: var(--el-pri); }
.der { font: italic 19px var(--el-body); color: var(--el-note); margin-top: 8px; }
.skr { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 10px 0; border-bottom: 1px solid var(--el-line1); }
.skr b { font: 600 18px var(--el-display); letter-spacing: .05em; text-transform: uppercase; color: var(--el-txt); }
.skr .m { font: 600 13px var(--el-display); letter-spacing: .1em; color: var(--el-dim); text-align: right; text-transform: uppercase; }
.skr .d { grid-column: 1 / -1; font: italic 18px var(--el-body); color: var(--el-muted); }
.psv { font: italic 19px var(--el-body); color: var(--el-note); line-height: 1.3; }
.psv b { font: 600 15px var(--el-display); letter-spacing: .12em; font-style: normal; color: #ffe29a; text-transform: uppercase; margin-right: 8px; }
.list .li { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 8px; border-bottom: 1px solid var(--el-line1); cursor: pointer; transition: background .2s; }
.list .li img { width: 42px; height: 42px; object-fit: cover; border: 1px solid var(--el-line2); }
.list .li b { font: 600 17px var(--el-display); letter-spacing: .05em; text-transform: uppercase; color: var(--el-txt); }
.list .li small { margin-left: auto; font: italic 16px var(--el-body); color: var(--el-dim); }
.list .li:hover, .list .li.on { background: linear-gradient(90deg, rgba(224,112,42,.14), transparent 80%); }
.list .li.on b { color: var(--el-on); }
.book { position: absolute; display: grid; grid-template-columns: 1fr 1fr; background: linear-gradient(180deg, rgba(34,25,16,.96), rgba(14,10,7,.97)); border: 1px solid rgba(217,178,106,.42); box-shadow: 0 0 0 3px rgba(8,6,4,.7), 0 30px 60px rgba(0,0,0,.6); }
.book::before { content: ''; position: absolute; left: 50%; top: 18px; bottom: 18px; width: 1px; background: linear-gradient(180deg, transparent, var(--el-line3), transparent); }
.book .pg { padding: 40px 48px; overflow: hidden; }
.ribbon { position: absolute; display: flex; gap: 2px; }
.ribbon button { all: unset; cursor: pointer; padding: 12px 18px 14px; font: 600 15px var(--el-display); letter-spacing: .12em; text-transform: uppercase; color: var(--el-dim); border: 1px solid var(--el-line2); border-bottom: none; background: rgba(12,9,6,.85); transition: color .18s, transform .18s var(--el-ease); }
.ribbon button:hover { color: var(--el-on); transform: translateY(-3px); }
.ribbon button.on { color: var(--el-on); background: linear-gradient(180deg, rgba(60,40,22,.95), rgba(34,25,16,.96)); border-color: rgba(217,178,106,.5); }
.card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 1px solid var(--el-line2); background: linear-gradient(180deg, rgba(34,25,16,.82), rgba(10,7,5,.9) 70%); cursor: pointer; transition: transform .28s var(--el-ease), border-color .2s, box-shadow .28s; }
.card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--g); opacity: .6; }
.card:hover { transform: translateY(-6px); border-color: var(--el-gold); box-shadow: 0 18px 34px rgba(0,0,0,.5); }
.card .top { display: flex; gap: 14px; align-items: center; }
.card .top img { width: 84px; height: 84px; object-fit: cover; border: 1px solid var(--el-line3); }
.card .n { font: 600 20px var(--el-display); letter-spacing: .05em; text-transform: uppercase; color: var(--el-on); }
.card .r { font: italic 17px var(--el-body); color: var(--el-muted); }
.card .g { font: 600 12px var(--el-display); letter-spacing: .24em; color: var(--g); }
.card .sks { font: italic 16px var(--el-body); color: var(--el-note); line-height: 1.3; }
.drawer { position: absolute; top: 0; bottom: 0; right: 0; z-index: 20; transform: translateX(104%); transition: transform .45s var(--el-ease); }
.drawer.on { transform: none; }
.status-row { display: grid; grid-template-columns: 220px 1fr; padding: 12px 0; border-bottom: 1px solid var(--el-line1); }
.status-row b { font: 600 18px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-on); }
.status-row span { font: italic 19px var(--el-body); color: var(--el-note); }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="stage"></div>
<script src="data.js"></script>
<script src="stage.js"></script>
<script>
const M = window.MOCK;
const GROUP = { str: '#e0643c', dex: '#8fdc50', int: '#8a8cf5', luck: '#2fcfa0' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const AV = (id) => `assets/img/av-${id}.webp`;
const SECTIONS = [
  { id: 'start', name: 'Getting Started', n: 5 }, { id: 'classes', name: 'Classes', n: M.classes.length }, { id: 'skills', name: 'Skills', n: 44 },
  { id: 'mech', name: 'Stats & Mechanics', n: 9 }, { id: 'statuses', name: 'Statuses', n: M.statuses.length }, { id: 'elements', name: 'Elements', n: 7 }, { id: 'assets', name: 'Assets', n: 6 },
];
const MECH = [
  ['Turn order', 'Every unit has SPD. A counter fills each tick by SPD; whoever reaches the threshold first acts. Faster heroes act more often, and the turn bar shows the forecast.'],
  ['Formation', 'Each side stands on 4 rows x 3 lanes. Melee skills reach the enemy\'s foremost occupied row; ranged and spells reach any row. Area skills use shapes: row, column, plus, x and rectangles.'],
  ['Mana and cooldowns', 'MP regenerates at the start of your own turn. Strong skills have cooldowns counted in your own turns; some ultimates start on cooldown.'],
  ['Armor', 'Armor reduces physical damage by armor / (armor + 30). Magic armor does the same against spells.'],
  ['Critical hits', 'Crit is the final multiplier on damage and healing, never on shields.'],
];
let sec = 'classes', cur = 'warrior', V = 1, ST = null, SS = null, open = false;
const cls = (id) => M.classes.find((c) => c.id === id);

function classArticle(id) {
  const c = cls(id);
  const a = ['str', 'dex', 'int', 'luck'].map((k) => `<span class="${c.primary === k ? 'pri' : ''}"><small>${k.toUpperCase()}</small>${c.stats[k]}</span>`).join('');
  return `<div class="art" style="--g:${GROUP[c.primary] || '#b9a27a'}"><div style="display:flex;gap:22px;align-items:center"><img src="${AV(id)}" style="width:120px;height:120px;border:1px solid var(--el-line3);object-fit:cover" alt="">
    <div><h1>${esc(c.name)}</h1><div class="role">${esc(c.role)} · <span style="color:${GROUP[c.primary]}">${(c.primary || '').toUpperCase()}</span></div></div></div>
    <div class="attrs" style="margin-top:16px">${a}</div><div class="der">HP ${c.stats.hp} · MP ${c.stats.mp} · SPD ${c.stats.spd} · Armor ${c.stats.armor}${c.stats.magicArmor ? ` · Magic armor ${c.stats.magicArmor}` : ''} · Crit ${c.stats.crit}%</div>
    ${c.passive ? `<h3 class="el-heading">Passive</h3><div class="psv"><b>${esc(c.passive.name)}</b>${esc(c.passive.text)}</div>` : ''}
    <h3 class="el-heading">Skills</h3>${c.skills.map((s) => `<div class="skr"><b>${esc(s.name)}</b><span class="m">${esc(s.cost)}${s.cd && s.cd !== '-' ? ' · CD ' + esc(s.cd) : ''}</span><span class="d">${esc(s.target)} · ${esc(s.lines.join(' · '))}</span></div>`).join('')}</div>`;
}
function sectionArticle() {
  if (sec === 'classes') return classArticle(cur);
  if (sec === 'statuses') return `<div class="art"><h1>Statuses</h1><div class="role">Buffs and debuffs that last a few turns</div>${M.statuses.map((s) => `<div class="status-row"><b>${esc(s.name)}</b><span>${esc(s.text)}</span></div>`).join('')}</div>`;
  const m = MECH.find((x) => x[0] === cur) || MECH[0];
  return `<div class="art"><h1>${esc(m[0])}</h1><div class="role">Stats & Mechanics</div><p>${esc(m[1])}</p><p class="it" style="color:var(--el-dim)">Every number in the Codex comes from the game data, so it is always current.</p></div>`;
}
function entries() {
  if (sec === 'classes') return M.classes.map((c) => ({ id: c.id, name: c.name, sub: c.role, img: AV(c.id), g: GROUP[c.primary] }));
  if (sec === 'statuses') return M.statuses.map((s) => ({ id: s.id, name: s.name, sub: s.text }));
  return MECH.map((m) => ({ id: m[0], name: m[0], sub: 'Mechanic' }));
}
const pick = (s) => { sec = s; cur = s === 'classes' ? 'warrior' : s === 'statuses' ? M.statuses[0].id : MECH[0][0]; if (!['classes', 'statuses'].includes(s)) sec = 'mech'; };
const back = '<button class="el-link abs fi" style="left:48px;top:26px" data-back><span>◂ Back</span><small>Esc</small></button>';
const search = (w) => `<div class="search" style="width:${w}px"><svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="6"/><path d="M13 13 L18 18"/></svg>Search the Codex…</div>`;

// ---------- 1: Codex (sol menü + liste + madde) ----------
function v1(st, W) {
  const navs = SECTIONS.map((s) => `<div class="navrow${(s.id === sec || (s.id === 'mech' && sec === 'mech')) ? ' on' : ''}" data-sec="${s.id}"><i class="el-dia"></i><span>${esc(s.name)}</span><small>${s.n}</small></div>`).join('');
  const list = sec === 'classes'
    ? `<div style="display:grid;grid-template-columns:repeat(3,120px);gap:26px 22px">${entries().map((e) => `<div class="tile${e.id === cur ? ' on' : ''}" style="--g:${e.g}" data-ent="${e.id}"><div class="pic"><img src="${e.img}" alt=""></div><span>${esc(e.name)}</span></div>`).join('')}</div>`
    : `<div class="list">${entries().map((e) => `<div class="li${e.id === cur ? ' on' : ''}" data-ent="${e.id}"><b>${esc(e.name)}</b><small>${esc(e.sub)}</small></div>`).join('')}</div>`;
  st.innerHTML = `<div class="bg"></div>${back}
    <div class="el-title abs fi" style="left:50%;transform:translateX(-50%);top:34px">Codex</div>
    <div class="abs fu" style="--d:.1s;left:64px;top:140px;width:380px">${search(380)}<div style="margin-top:18px">${navs}</div></div>
    <div class="abs fu" style="--d:.2s;left:500px;top:140px;width:460px"><div class="el-heading" style="margin-bottom:22px">${esc(SECTIONS.find((s) => s.id === sec)?.name || 'Stats & Mechanics')}</div>${list}</div>
    <div class="abs el-panel fu" style="--d:.3s;left:1010px;right:64px;top:140px;bottom:54px;padding:34px 40px;overflow:auto">${sectionArticle()}</div>`;
}
// ---------- 2: Tome (kitap: sol sayfa dizin, sağ sayfa madde) ----------
function v2(st, W) {
  const bw = Math.min(1640, W - 200), bx = (W - bw) / 2;
  const ribbon = SECTIONS.map((s) => `<button class="${s.id === sec ? 'on' : ''}" data-sec="${s.id}">${esc(s.name)}</button>`).join('');
  const list = `<div class="list">${entries().map((e) => `<div class="li${e.id === cur ? ' on' : ''}" data-ent="${e.id}">${e.img ? `<img src="${e.img}" alt="">` : '<i class="el-dia hollow"></i>'}<b>${esc(e.name)}</b><small>${esc(e.sub)}</small></div>`).join('')}</div>`;
  st.innerHTML = `<div class="bg"></div>${back}
    <div class="ribbon fi" style="left:${bx + 40}px;top:96px">${ribbon}</div>
    <div class="book fu" style="--d:.1s;left:${bx}px;width:${bw}px;top:146px;bottom:50px">
      <div class="pg"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div class="el-title" style="font-size:28px;justify-content:flex-start">${esc(SECTIONS.find((s) => s.id === sec)?.name || 'Mechanics')}</div>${search(300)}</div>${list}</div>
      <div class="pg" style="overflow:auto">${sectionArticle()}</div></div>`;
}
// ---------- 3: Gallery (üst sekmeler + kart ızgarası + sağdan açılan madde) ----------
function v3(st, W) {
  const tabs = SECTIONS.map((s) => `<button class="el-link${s.id === sec ? '' : ''}" data-sec="${s.id}" style="${s.id === sec ? 'color:var(--el-on);text-shadow:var(--el-glow)' : ''}"><span>${esc(s.name)}</span></button>`).join('<span style="color:rgba(217,178,106,.35);font-size:12px">◆</span>');
  const cards = sec === 'classes'
    ? M.classes.map((c, i) => `<div class="card fu" style="--d:${0.1 + i * 0.04}s;--g:${GROUP[c.primary]}" data-ent="${c.id}"><div class="top"><img src="${AV(c.id)}" alt=""><div><div class="n">${esc(c.name)}</div><div class="r">${esc(c.role)}</div><div class="g">${(c.primary || '').toUpperCase()}</div></div></div><div class="sks">${c.skills.map((s) => esc(s.name)).join(' · ')}</div></div>`).join('')
    : entries().map((e, i) => `<div class="card fu" style="--d:${0.1 + i * 0.04}s;--g:var(--el-gold)" data-ent="${e.id}"><div class="n">${esc(e.name)}</div><div class="sks">${esc(e.sub)}</div></div>`).join('');
  st.innerHTML = `<div class="bg"></div>${back}
    <div class="el-title abs fi" style="left:50%;transform:translateX(-50%);top:34px">Codex</div>
    <div class="abs fi" style="left:50%;transform:translateX(-50%);top:104px;display:flex;align-items:center;gap:4px">${tabs}</div>
    <div class="abs fi" style="right:64px;top:30px">${search(320)}</div>
    <div class="abs" style="left:64px;right:64px;top:190px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;align-content:start">${cards}</div>
    <div class="drawer el-panel${open ? ' on' : ''}" style="width:820px;padding:40px 44px;overflow:auto" id="drawer"><button class="el-link" style="position:absolute;right:16px;top:10px" data-close><span>Close</span><small>Esc</small></button>${sectionArticle()}</div>`;
}
const VIEWS = [v1, v2, v3];
function render(v, st, S) { V = v; ST = st; SS = S; VIEWS[v - 1](st, S.W); }
mockStage('Codex mockups', ['Codex', 'Tome', 'Gallery'], render);
document.getElementById('stage').addEventListener('click', (e) => {
  const s = e.target.closest('[data-sec]'), en = e.target.closest('[data-ent]');
  if (e.target.closest('[data-close]')) { open = false; ST.querySelector('#drawer')?.classList.remove('on'); return; }
  if (s) { pick(s.dataset.sec); open = false; render(V, ST, SS); return; }
  if (en) { cur = en.dataset.ent; open = true; render(V, ST, SS); }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && open) { open = false; ST.querySelector('#drawer')?.classList.remove('on'); } });
</script>
</body>
</html>
