<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Campaign Map Mockups</title>
<!--
  Sefer haritası ekranı: 3 taslak (Ömer 2026-10-09). Oyun kodu DEĞİL; seçim için karşılaştırma sayfası. Açılış: mockups/campaign.html?v=1..3
  Dil: tasarım kiti (kit.css = src/ui/elegant.css kopyası). Veri gerçek (data.js: harita düğümleri, class'lar, item'ler).
  Bir kahramana tıklayınca karakter paneli açılır (seviye / XP, 6 ekipman yuvası, statlar); bir düğüme tıklayınca düğüm bilgisi.
-->
<link rel="stylesheet" href="kit.css" />
<link rel="stylesheet" href="common.css" />
<style>
.map { position: absolute; inset: 0; overflow: hidden; }
.map img.bg { position: absolute; max-width: none; }
.map .shade { position: absolute; inset: 0; pointer-events: none; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; display: grid; place-items: center; cursor: pointer; }
.node i { width: 22px; height: 22px; transform: rotate(45deg); background: rgba(12,9,6,.85); box-shadow: 0 0 0 1px rgba(217,178,106,.75), 0 0 0 4px rgba(12,8,5,.6); transition: transform .25s var(--el-ease), box-shadow .2s, background .2s; }
.node.boss i { width: 30px; height: 30px; }
.node.done i { background: rgba(217,178,106,.35); box-shadow: 0 0 0 1px rgba(217,178,106,.45); }
.node.locked i { background: rgba(12,9,6,.6); box-shadow: 0 0 0 1px rgba(217,178,106,.25); }
.node.open i { box-shadow: 0 0 0 1px var(--el-on), 0 0 14px rgba(240,140,40,.55), 0 0 0 4px rgba(12,8,5,.6); }
.node.here i { background: var(--el-ember); box-shadow: 0 0 0 1px var(--el-ember2), 0 0 18px rgba(240,140,40,.8); }
.node.sel i { transform: rotate(45deg) scale(1.25); }
.node:hover i { transform: rotate(45deg) scale(1.2); }
.node .lb { position: absolute; top: 46px; white-space: nowrap; font: 600 15px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-txt); text-shadow: 0 2px 4px #0c0805, 0 0 8px #0c0805; pointer-events: none; }
.node.above .lb { top: auto; bottom: 46px; }
.node.locked .lb { color: var(--el-dim); }
.node.open .lb, .node.here .lb, .node.sel .lb { color: var(--el-on); }
.node .ty { position: absolute; top: 66px; font: italic 14px var(--el-body); color: var(--el-muted); white-space: nowrap; text-shadow: 0 2px 4px #0c0805; pointer-events: none; }
.node.above .ty { top: auto; bottom: 30px; }

.topbar { position: absolute; left: 0; right: 0; top: 0; height: 84px; display: flex; align-items: center; gap: 28px; padding: 0 48px;
  background: linear-gradient(180deg, rgba(8,6,4,.92), rgba(8,6,4,.6) 70%, transparent); z-index: 5; }
.topbar .ttl { font: 600 30px var(--el-display); letter-spacing: .12em; text-transform: uppercase; background: linear-gradient(180deg,#fbe7b0,#e6c27a 55%,#b88a42); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 3px #000); }
.topbar .sub { font: italic 20px var(--el-body); color: var(--el-muted); }
.topbar .grow { flex: 1; height: 1px; background: var(--el-line1); }
.res { display: inline-flex; align-items: center; gap: 8px; font: 600 20px var(--el-display); color: var(--el-on); }
.res small { font: italic 16px var(--el-body); color: var(--el-muted); text-transform: none; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe9a8, #c8902e 60%, #6e4f1e); box-shadow: 0 0 0 1px #3a2a10; }

.hero { position: relative; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform .25s var(--el-ease); }
.hero:hover { transform: translateY(-4px); }
.hero .pic { position: relative; width: 96px; height: 96px; border: 1px solid var(--el-line3); background: #120c08; overflow: hidden; flex: none; }
.hero .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s var(--el-ease); }
.hero:hover .pic { border-color: var(--el-on); }
.hero:hover .pic img { transform: scale(1.06); }
.hero .lv { position: absolute; right: -9px; bottom: -9px; }
.hero .nm { font: 600 19px var(--el-display); letter-spacing: .05em; text-transform: uppercase; color: var(--el-on); }
.hero .cl { font: italic 16px var(--el-body); color: var(--el-muted); }
.bar { position: relative; height: 5px; background: rgba(217,178,106,.12); margin-top: 6px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6e9e4a, #9fd06a); }
.bar.xp i { background: linear-gradient(90deg, rgba(224,112,42,.7), #ffd76a); }
.bar.mp i { background: linear-gradient(90deg, #3d6aa8, #7fb0ff); }

.ninfo h2 { margin: 0; font: 600 34px var(--el-display); letter-spacing: .08em; text-transform: uppercase; color: var(--el-on); }
.ninfo .k { font: italic 20px var(--el-body); color: var(--el-muted); margin: 2px 0 14px; }
.ninfo p { margin: 8px 0; font-size: 20px; line-height: 1.3; color: var(--el-note); }
.ninfo .row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--el-line1); font-size: 19px; }
.ninfo .row b { font: 600 15px var(--el-display); letter-spacing: .12em; text-transform: uppercase; color: var(--el-muted); }
.foes { display: flex; gap: 10px; margin: 6px 0 4px; }
.foes img { width: 56px; height: 56px; object-fit: cover; border: 1px solid var(--el-line2); transform: scaleX(-1); }

/* Karakter paneli */
.cp { display: flex; flex-direction: column; gap: 16px; }
.cp .head { display: flex; gap: 18px; align-items: flex-end; }
.cp .name { font: 600 40px var(--el-display); letter-spacing: .06em; text-transform: uppercase; color: var(--el-on); line-height: 1; }
.cp .cls { font: italic 21px var(--el-body); color: var(--el-muted); margin-top: 4px; }
.cp .lvrow { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; font: 600 18px var(--el-display); letter-spacing: .1em; color: var(--el-txt); }
.cp .lvrow small { font: italic 16px var(--el-body); letter-spacing: 0; color: var(--el-muted); }
.doll { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: center; }
.doll .fig { width: 200px; height: 300px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
.doll .fig::after { content: ''; position: absolute; bottom: -6px; left: 16px; right: 16px; height: 28px; border-radius: 50%; background: radial-gradient(ellipse, rgba(224,112,42,.2), transparent 70%); }
.doll .fig img { max-width: 220px; max-height: 296px; position: relative; z-index: 1; filter: drop-shadow(0 10px 8px rgba(0,0,0,.5)); }
.slots { display: flex; flex-direction: column; gap: 12px; }
.slot { min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 6px 10px; border: 1px solid var(--el-line2); background: rgba(8,6,4,.55); cursor: pointer; transition: border-color .18s, transform .18s var(--el-ease); }
.slot:hover { border-color: var(--el-on); transform: translateY(-2px); }
.slot .ic { width: 50px; height: 50px; flex: none; display: grid; place-items: center; border: 1px solid var(--el-line2); background: radial-gradient(circle, rgba(217,178,106,.08), rgba(8,6,4,.6)); }
.slot .ic svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.slot .t { font: 600 15px var(--el-display); letter-spacing: .06em; text-transform: uppercase; line-height: 1.15; }
.slot .s { font: italic 15px var(--el-body); color: var(--el-muted); }
.slot.empty .t { color: var(--el-dim); }
.slots.r .slot { flex-direction: row-reverse; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 28px; }
.stats div { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--el-line1); font: 600 18px var(--el-display); letter-spacing: .06em; color: var(--el-txt); }
.stats div span { font: 600 13px var(--el-display); letter-spacing: .14em; color: var(--el-muted); }
.stats div.pri { color: var(--el-pri); }
.stats em { font: italic 15px var(--el-body); color: #9fd06a; margin-left: 6px; letter-spacing: 0; }
.tabs2 { display: flex; gap: 6px; border-bottom: 1px solid var(--el-line1); }
.tabs2 button { all: unset; cursor: pointer; padding: 10px 14px; font: 600 16px var(--el-display); letter-spacing: .1em; text-transform: uppercase; color: var(--el-dim); border-bottom: 2px solid transparent; }
.tabs2 button.on { color: var(--el-on); border-color: var(--el-ember); }
.sk { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--el-line1); }
.sk b { font: 600 16px var(--el-display); letter-spacing: .05em; text-transform: uppercase; color: var(--el-txt); }
.sk div { font: italic 16px var(--el-body); color: var(--el-muted); }
.drawer { position: absolute; top: 0; bottom: 0; z-index: 20; transition: transform .45s var(--el-ease), opacity .3s; }
.drawer.l { left: 0; transform: translateX(-104%); }
.drawer.r { right: 0; transform: translateX(104%); }
.drawer.on { transform: none; }
.modal { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5,3,2,.62); opacity: 0; pointer-events: none; transition: opacity .25s; }
.modal.on { opacity: 1; pointer-events: auto; }
.modal > .el-panel { transform: translateY(20px); transition: transform .35s var(--el-ease); }
.modal.on > .el-panel { transform: none; }
.x { position: absolute; right: 14px; top: 10px; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; }
.bag .it { width: 54px; height: 54px; border: 1px solid var(--el-line2); background: rgba(8,6,4,.55); display: grid; place-items: center; }
.bag .it svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.note { font: italic 17px var(--el-body); color: var(--el-dim); }
.medal { position: relative; width: 92px; height: 92px; border-radius: 50%; overflow: hidden; border: 1px solid var(--el-line3); box-shadow: 0 0 0 3px rgba(12,8,5,.7); cursor: pointer; transition: transform .25s var(--el-ease), border-color .2s; background: #120c08; }
.medal img { width: 100%; height: 100%; object-fit: cover; }
.medal:hover { transform: translateY(-4px); border-color: var(--el-on); }
.medwrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.medwrap .el-badge { position: absolute; right: -4px; top: 64px; }
.medwrap .bar { width: 80px; margin: 0; }
</style>
</head>
<body>
<div id="tabs"></div>
<div id="stage"></div>
<script src="data.js"></script>
<script src="stage.js"></script>
<script>
const M = window.MOCK;
const C = Object.fromEntries(M.classes.map((c) => [c.id, c]));
const RAR = Object.fromEntries(M.rarities.map((r) => [r.id, r.color]));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const AV = (id) => `assets/img/av-${id}.webp`;
const SP = (id) => `assets/img/sp-${id}.webp`;
// Gear slot glyphs (simple outline SVG; the game would use its pixel-art icons)
const G = {
  weapon: '<svg viewBox="0 0 32 32"><path d="M6 26 L22 10 L26 6 L24 12 L8 28 Z M10 20 L14 24 M5 23 L9 27"/></svg>',
  helm: '<svg viewBox="0 0 32 32"><path d="M6 20 C6 10 26 10 26 20 L26 26 L19 26 L19 19 L13 19 L13 26 L6 26 Z M16 7 L16 12"/></svg>',
  armor: '<svg viewBox="0 0 32 32"><path d="M9 6 L13 8 L19 8 L23 6 L27 11 L24 14 L24 27 L8 27 L8 14 L5 11 Z M16 9 L16 27"/></svg>',
  gloves: '<svg viewBox="0 0 32 32"><path d="M10 27 L10 15 L8 9 L11 8 L13 14 L13 6 L16 6 L16 14 L17 5 L20 5 L19 14 L21 8 L24 9 L22 17 L22 27 Z"/></svg>',
  boots: '<svg viewBox="0 0 32 32"><path d="M10 5 L17 5 L17 19 L26 22 L26 27 L8 27 L8 21 Z M10 11 L17 11"/></svg>',
  trinket: '<svg viewBox="0 0 32 32"><circle cx="16" cy="19" r="7"/><path d="M12 6 L16 12 L20 6"/><circle cx="16" cy="19" r="2.5"/></svg>',
};
const SLOT_NAME = Object.fromEntries(M.slots.map((s) => [s.id, s.name]));
const statTxt = (st) => Object.entries(st || {}).map(([k, v]) => `+${v}${['might', 'crit', 'evasion'].includes(k) ? '%' : ''} ${M.statNames[k] || k}`).join(' · ');

// Sefer durumu (örnek): Ashford'dayız, ilk 3 düğüm bitti, 5A/5B açık
const PARTY = [
  { id: 'warrior', lv: 5, xp: 340, next: 500, hp: 0.82, mp: 1 },
  { id: 'mage', lv: 4, xp: 120, next: 420, hp: 0.64, mp: 0.55 },
  { id: 'archer', lv: 4, xp: 390, next: 420, hp: 0.9, mp: 0.8 },
  { id: 'paladin', lv: 3, xp: 60, next: 320, hp: 1, mp: 0.7 },
];
const DONE = new Set(['1', '2', '3']), HERE = '4', OPEN = new Set(['5A', '5B']);
const gearOf = (id, i) => {
  const out = {};
  M.slots.forEach((s, k) => {
    const list = M.items.filter((it) => it.slot === s.id);
    if (!list.length || (i + k) % 5 === 4) return; // birkaç yuva boş kalsın
    out[s.id] = list[(i * 3 + k) % list.length];
  });
  return out;
};
const GEAR = Object.fromEntries(PARTY.map((p, i) => [p.id, gearOf(p.id, i)]));
const bonus = (id, k) => Object.values(GEAR[id]).reduce((a, it) => a + (it.stats?.[k] || 0), 0);

let sel = '5A';
let hero = null;
let V = 1, ST = null;

function mapHtml(W, opts = {}) {
  const [x0, y0, x1, y1] = M.map.region;
  const IW = 1916, IH = 821;
  const k = 1920 / ((x1 - x0) * IW);
  const off = (W - 1920) / 2;
  const L = off - x0 * IW * k, T = -y0 * IH * k + (opts.dy || 0);
  const P = (n) => [off + n.pos[0] * 1920, n.pos[1] * 1080 + (opts.dy || 0)];
  const by = Object.fromEntries(M.map.nodes.map((n) => [n.id, n]));
  const lines = M.map.edges.map((e) => {
    const a = by[e.from], b = by[e.to];
    if (!a || !b) return '';
    const [ax, ay] = P(a), [bx, by2] = P(b);
    const done = DONE.has(e.from) && (DONE.has(e.to) || e.to === HERE);
    return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by2}" stroke="rgba(217,178,106,${done ? 0.75 : 0.35})" stroke-width="${done ? 2 : 1.5}" ${e.style === 'dashed' || !done ? 'stroke-dasharray="6 8"' : ''}/>`;
  }).join('');
  const nodes = M.map.nodes.map((n) => {
    const [x, y] = P(n);
    const st = n.id === HERE ? 'here' : DONE.has(n.id) ? 'done' : OPEN.has(n.id) ? 'open' : 'locked';
    return `<div class="node ${st} ${n.type}${n.label === 'above' ? ' above' : ''}${sel === n.id ? ' sel' : ''}" style="left:${x}px;top:${y}px" data-node="${n.id}"><i></i><span class="lb">${esc(n.name)}</span>${opts.types ? `<span class="ty">${esc(n.subtitle || '')}</span>` : ''}</div>`;
  }).join('');
  return `<div class="map fi"><img class="bg" src="assets/img/map-wide.webp" style="left:${L}px;top:${T}px;width:${IW * k}px;height:${IH * k}px" alt="">
    <div class="shade" style="background:${opts.shade || 'radial-gradient(ellipse at 50% 55%, rgba(8,6,4,0) 40%, rgba(8,6,4,.55) 100%)'}"></div>
    <svg>${lines}</svg>${nodes}</div>`;
}

function nodeInfo(id, compact = false) {
  const n = M.map.nodes.find((x) => x.id === id);
  if (!n) return '';
  const st = n.id === HERE ? 'You are here' : DONE.has(n.id) ? 'Cleared' : OPEN.has(n.id) ? 'Reachable' : 'Not yet reachable';
  const foes = ['cutthroat', 'archer', 'hexer'].slice(0, n.type === 'battle' || n.type === 'elite' || n.type === 'boss' ? 3 : 0);
  return `<div class="ninfo"><h2>${esc(n.name)}</h2><div class="k">${esc(n.subtitle || n.type)} · ${st}</div>
    ${foes.length ? `<div class="foes">${foes.map((f) => `<img src="${AV(f)}" alt="">`).join('')}</div>` : ''}
    ${compact ? '' : `<p>${n.type === 'town' ? 'Rest, recruit and trade. Your heroes recover here.' : n.type === 'treasure' ? 'An unguarded cache. Choose one of three rewards.' : n.type === 'event' ? 'A crossroads encounter. Your choice shapes the road ahead.' : 'Outlaws hold the road. Defeat them to move on.'}</p>`}
    <div class="row"><b>Reward</b><span>${n.type === 'boss' ? 'Legendary item · 120 gold' : n.type === 'elite' ? 'Rare item · 60 gold' : '25-40 gold · item chance'}</span></div>
    <div class="row"><b>Difficulty</b><span>${n.type === 'boss' ? 'Deadly' : n.type === 'elite' ? 'Hard' : 'Fair'}</span></div>
    ${OPEN.has(n.id) ? `<div style="display:flex;justify-content:center;margin-top:22px"><button class="el-btn primary ready">March</button></div>` : ''}</div>`;
}

function slotHtml(id, s, right) {
  const it = GEAR[id][s.id];
  return `<div class="slot${it ? '' : ' empty'}" title="${esc(SLOT_NAME[s.id])}"><div class="ic" style="color:${it ? RAR[it.rarity] : 'var(--el-dim)'}">${G[s.id] || ''}</div>
    <div><div class="t" style="color:${it ? RAR[it.rarity] : ''}">${it ? esc(it.name) : esc(SLOT_NAME[s.id])}</div><div class="s">${it ? `${esc(statTxt(it.stats))}` : 'Empty slot'}</div></div></div>`;
}

function statsHtml(id) {
  const c = C[id], s = c.stats;
  const row = (k, label, v, pri) => { const b = bonus(id, k); return `<div class="${pri ? 'pri' : ''}"><span>${label}</span><b>${v + b}${b ? `<em>+${b}</em>` : ''}</b></div>`; };
  return `<div class="stats">${row('str', 'STR', s.str, c.primary === 'str')}${row('dex', 'DEX', s.dex, c.primary === 'dex')}${row('int', 'INT', s.int, c.primary === 'int')}${row('luck', 'LUCK', s.luck, c.primary === 'luck')}
    ${row('hp', 'Max HP', s.hp)}${row('mp', 'MP', s.mp)}${row('armor', 'Armor', s.armor)}${row('magicArmor', 'M. Armor', s.magicArmor)}<div><span>SPD</span><b>${s.spd}</b></div><div><span>Crit</span><b>${s.crit}%</b></div></div>`;
}

function charPanel(id, layout) {
  const p = PARTY.find((x) => x.id === id), c = C[id];
  const left = M.slots.slice(0, 3), right = M.slots.slice(3);
  const head = `<div class="head"><div><div class="name">${esc(c.name)}</div><div class="cls">${esc(c.role)} · <span style="color:var(--el-pri)">${(c.primary || '').toUpperCase()}</span></div>
      <div class="lvrow">Level ${p.lv} <small>${p.xp} / ${p.next} XP</small></div><div class="bar xp" style="width:300px"><i style="width:${(p.xp / p.next) * 100}%"></i></div></div></div>`;
  const doll = `<div class="doll"><div class="slots">${left.map((s) => slotHtml(id, s)).join('')}</div><div class="fig"><img src="${SP(id)}" alt=""></div><div class="slots r">${right.map((s) => slotHtml(id, s, true)).join('')}</div></div>`;
  const bag = `<div><div class="el-heading">Bag · 5 / 20</div><div class="bag" style="margin-top:10px">${M.items.slice(10, 15).map((it) => `<div class="it" style="color:${RAR[it.rarity]}" title="${esc(it.name)}">${G[it.slot] || ''}</div>`).join('')}</div></div>`;
  const passive = c.passive ? `<div class="note" style="color:var(--el-note)"><b class="cz" style="font-size:14px;color:#ffe29a;font-style:normal;letter-spacing:.12em;margin-right:8px">${esc(c.passive.name)}</b>${esc(c.passive.text)}</div>` : '';
  if (layout === 'tabs') {
    return `<div class="cp">${head}<div class="tabs2"><button class="on" data-tab="gear">Gear</button><button data-tab="stats">Stats</button><button data-tab="skills">Skills</button></div>
      <div data-pane="gear">${doll}<div style="margin-top:16px">${bag}</div></div>
      <div data-pane="stats" hidden>${statsHtml(id)}<div style="margin-top:14px">${passive}</div></div>
      <div data-pane="skills" hidden>${c.skills.map((s) => `<div class="sk"><div style="flex:1"><b>${esc(s.name)}</b><div>${esc(s.lines[0] || s.target)}</div></div><span class="note">${esc(s.cost)}${s.cd && s.cd !== '-' ? ' · ' + esc(s.cd) : ''}</span></div>`).join('')}</div></div>`;
  }
  return `<div class="cp">${head}${doll}<div><div class="el-heading">Attributes</div>${statsHtml(id)}</div>${passive}${layout === 'full' ? bag : ''}</div>`;
}

function heroCard(p, mode) {
  const c = C[p.id];
  if (mode === 'medal') return `<div class="medwrap" data-hero="${p.id}"><div class="medal"><img src="${AV(p.id)}" alt=""></div><span class="el-badge gold">${p.lv}</span><div class="bar"><i style="width:${p.hp * 100}%"></i></div></div>`;
  return `<div class="hero" data-hero="${p.id}"><div class="pic"><img src="${AV(p.id)}" alt=""><span class="el-badge gold lv">${p.lv}</span></div>
    <div style="min-width:${mode === 'row' ? 150 : 190}px"><div class="nm">${esc(c.name)}</div><div class="cl">${esc(c.role)}</div><div class="bar"><i style="width:${p.hp * 100}%"></i></div><div class="bar mp" style="margin-top:4px"><i style="width:${p.mp * 100}%"></i></div></div></div>`;
}

const topbar = (W, extra = '') => `<div class="topbar fi">
  <span class="ttl">Valdoria</span><span class="sub">Region I · The Mill Lands</span><span class="grow"></span>${extra}
  <span class="res"><i class="coin"></i>142 <small>gold</small></span><span class="res">Day 6</span>
  <button class="el-btn" style="min-height:44px">Menu <small style="font:italic 15px var(--el-body);text-transform:none;color:var(--el-dim);margin-left:10px;letter-spacing:0">Esc</small></button></div>`;

// ---------- 1: Chronicle ----------
function v1(st, W) {
  st.innerHTML = `${mapHtml(W)}${topbar(W)}
  <div class="abs el-panel fu" style="--d:.2s;right:48px;top:120px;width:440px;padding:26px 28px" id="ninfo">${nodeInfo(sel)}</div>
  <div class="abs fu" style="--d:.3s;right:48px;bottom:40px;display:flex;gap:26px;padding:18px 24px;background:linear-gradient(270deg,rgba(8,6,4,.88),rgba(8,6,4,.6));border-top:1px solid var(--el-line2)">${PARTY.map((p) => heroCard(p, 'row')).join('')}</div>
  <div class="drawer l el-panel" id="drawer" style="width:800px;padding:96px 34px 30px;overflow:hidden auto">${hero ? charPanel(hero, 'full') : ''}<button class="el-link x" data-close><span>Close</span><small>Esc</small></button></div>`;
}
// ---------- 2: War Table ----------
function v2(st, W) {
  st.innerHTML = `${mapHtml(W, { shade: 'linear-gradient(90deg, rgba(8,6,4,.92) 0, rgba(8,6,4,.55) 420px, rgba(8,6,4,.05) 50%, rgba(8,6,4,.55) calc(100% - 440px), rgba(8,6,4,.92) 100%)', types: true })}${topbar(W)}
  <div class="abs fu" style="--d:.15s;left:48px;top:130px;display:flex;flex-direction:column;gap:22px">
    <div class="el-heading" style="width:330px">Your party · 4 / 4</div>${PARTY.map((p) => heroCard(p, 'col')).join('')}
    <div class="note" style="width:330px">Click a hero for level, gear and stats.</div></div>
  <div class="abs fu" style="--d:.25s;right:48px;top:130px;width:420px"><div class="el-heading">Selected road</div><div style="padding-top:14px" id="ninfo">${nodeInfo(sel)}</div></div>
  <div class="modal${hero ? ' on' : ''}" id="modal"><div class="el-panel corners" style="width:980px;padding:30px 36px">${hero ? charPanel(hero, 'full') : ''}<button class="el-link x" data-close><span>Close</span><small>Esc</small></button></div></div>`;
}
// ---------- 3: Atlas ----------
function v3(st, W) {
  const n = M.map.nodes.find((x) => x.id === sel);
  const off = (W - 1920) / 2;
  const px = off + n.pos[0] * 1920, py = n.pos[1] * 1080;
  const cardX = px > W / 2 ? px - 420 - 60 : px + 60;
  st.innerHTML = `${mapHtml(W, { shade: 'linear-gradient(180deg, rgba(8,6,4,.75), rgba(8,6,4,0) 22%, rgba(8,6,4,0) 80%, rgba(8,6,4,.7))' })}
  <div class="abs fi" style="left:48px;top:30px"><div class="cz" style="font-size:30px;letter-spacing:.12em;color:var(--el-on)">Valdoria</div><div class="it" style="color:var(--el-muted);font-size:19px">Region I · The Mill Lands · Day 6 · <span style="color:var(--el-on)">142 gold</span></div></div>
  <button class="el-btn abs fi" style="right:48px;top:32px;min-height:44px">Menu</button>
  <div class="abs fu" style="--d:.2s;left:50%;transform:translateX(-50%);top:26px;display:flex;gap:30px">${PARTY.map((p) => heroCard(p, 'medal')).join('')}</div>
  <div class="abs el-panel fu" style="--d:.1s;left:${Math.max(40, Math.min(W - 460, cardX))}px;top:${Math.max(170, Math.min(1080 - 470, py - 160))}px;width:420px;padding:22px 26px" id="ninfo">${nodeInfo(sel, true)}</div>
  <div class="drawer r el-panel" id="drawer" style="width:800px;padding:40px 36px 30px;overflow:hidden auto">${hero ? charPanel(hero, 'tabs') : ''}<button class="el-link x" data-close><span>Close</span><small>Esc</small></button></div>`;
}

const VIEWS = [v1, v2, v3];
function render(v, st, S) {
  V = v; ST = st;
  VIEWS[v - 1](st, S.W);
  requestAnimationFrame(() => st.querySelector('#drawer')?.classList.toggle('on', !!hero));
}
const S = mockStage('Campaign map mockups', ['Chronicle', 'War table', 'Atlas'], render);
document.getElementById('stage').addEventListener('click', (e) => {
  const n = e.target.closest('[data-node]');
  const h = e.target.closest('[data-hero]');
  const t = e.target.closest('[data-tab]');
  if (t) { const cp = t.closest('.cp'); cp.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b === t)); cp.querySelectorAll('[data-pane]').forEach((p) => (p.hidden = p.dataset.pane !== t.dataset.tab)); return; }
  if (e.target.closest('[data-close]') || (e.target.id === 'modal')) { hero = null; render(V, ST, S); return; }
  if (h) { hero = h.dataset.hero; render(V, ST, S); return; }
  if (n) { sel = n.dataset.node; render(V, ST, S); }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && hero) { hero = null; render(V, ST, S); } });
</script>
</body>
</html>
