<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Battle HUD Mockups</title>
<!--
  Savaş HUD'ı taslakları, 3. tur (Ömer 2026-10-09). Oyun kodu DEĞİL; seçim için karşılaştırma sayfası. Açılış: mockups/battle-hud.html?v=1..5
  Tüm taslaklar için kurallar:
   1. 4 ana skill alt çubuğun TAM ORTASINDA; küçük global eylemler (Rest / Skip / Move) skill'lerin hemen sağında DİKEY sütun (eski oyun düzeni).
   2. Düşman (ve dost) birimin üstüne gelince / dokununca kit kartı: ad, HP/MP, ana statlar, durumlar, pasif, seçili skill'in isabet/hasar önizlemesi.
   3. Her statın üstüne gelince kısa açıklama (formulas.json ve src/engine/stat-info.ts anlamları).
   4. Sıra çubuğu ekranın tam ortasında; şu an oynayan birim tam ortada, geçmiş solda, sıradakiler sağda.
   5. Boş yere gelince açıklama YOK; skill açıklaması yalnızca skill'in hemen üstünde (üstüne gelince ya da seçiliyken).
   6. Portre sol altta.  7. 1920x1080 öncelikli; 2000x900 ve 844x390'da da çalışır.
  Gerçek oyun görselleri battle-hud/ altında. Sağ kenardaki küçük düğmeler: taslak seçimi (1-5) ve gizle (◐).
-->
<link rel="stylesheet" href="battle-hud/kit.css" />
<style>
@font-face { font-family: 'Cinzel'; font-weight: 400 900; font-display: swap; src: url('battle-hud/fonts/Cinzel-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-weight: 400 800; font-display: swap; src: url('battle-hud/fonts/EBGaramond-normal-latin.woff2') format('woff2'); }
@font-face { font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap; src: url('battle-hud/fonts/EBGaramond-italic-latin.woff2') format('woff2'); }
:root {
  --gold: 217, 178, 106; --on: #f3d999; --txt: #d9c8a2; --muted: #a8977a; --dim: #7d705a; --note: #cdb88d; --pri: #ffd76a; --ember: #e0702a; --ember2: #ffb35a;
  --party: #4fa3ff; --enemy: #ff5a5a;
  --cin: Cinzel, Georgia, 'Palatino Linotype', serif; --gar: 'EB Garamond', Georgia, 'Palatino Linotype', serif; --num: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  --ease: cubic-bezier(0.33, 1, 0.68, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050403; overflow: hidden; color: var(--txt); -webkit-tap-highlight-color: transparent; }
#stage { position: absolute; left: 0; top: 0; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0d0a07; user-select: none; font-family: var(--gar); }
.abs { position: absolute; }
.ico { image-rendering: pixelated; display: block; flex: none; }

/* --- taslak seçici --- */
#pick { position: fixed; right: calc(4px + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; gap: 4px; }
#pick button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; font: 600 13px var(--cin); color: var(--muted); background: rgba(8,6,4,.78); border: 1px solid rgba(var(--gold), .3); }
#pick button.on { color: #1a0f06; background: var(--ember); border-color: var(--ember2); }
#pick.min button:not(.tog) { display: none; }
#cap { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: 10px; z-index: 50; font: italic 13px/1.25 var(--gar); color: var(--note); background: rgba(8,6,4,.84); border: 1px solid rgba(var(--gold), .25); padding: 6px 10px; max-width: 24vw; text-align: left; }
#cap b { display: block; font: 600 11px var(--cin); letter-spacing: .16em; text-transform: uppercase; color: var(--on); margin-bottom: 2px; font-style: normal; }
#pick.min ~ #cap { display: none; }
@media (max-height: 500px) { #cap { font-size: 10px; max-width: 30vw; padding: 4px 7px; } #cap b { font-size: 9px; } #pick { gap: 2px; } #pick button { width: 24px; height: 24px; font-size: 11px; } }

/* --- sahne --- */
.bg { position: absolute; inset: 0; background: url('battle-hud/img/bg.webp') center 30% / cover; }
.unit { position: absolute; transform: translate(-50%, -100%); height: 224px; cursor: pointer; }
.unit img { height: 100%; display: block; pointer-events: none; }
.unit.enemy img { transform: scaleX(-1); }
.unit::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 128px; height: 24px; transform: translateX(-50%); border-radius: 50%; z-index: -1; opacity: 0; transition: opacity .2s; }
.unit.active::after { opacity: 1; background: radial-gradient(rgba(240,140,40,.55), rgba(240,140,40,0) 70%); }
.unit.enemy.hov::after { opacity: 1; background: radial-gradient(rgba(255,90,90,.5), rgba(255,90,90,0) 70%); }
.unit.party.hov:not(.active)::after { opacity: 1; background: radial-gradient(rgba(79,163,255,.45), rgba(79,163,255,0) 70%); }
.unit.hov img { filter: brightness(1.12) drop-shadow(0 0 6px rgba(255,220,160,.35)); }
.plate { position: absolute; transform: translate(-50%, -100%); width: 150px; text-align: center; z-index: 2000; cursor: pointer; }
.plate .nm { font: 600 19px var(--cin); color: #f4ede1; letter-spacing: .04em; text-shadow: 0 2px 4px rgba(0,0,0,.95), 0 0 2px #000; white-space: nowrap; transition: color .18s, text-shadow .18s; }
.plate.hov .nm { color: var(--on); text-shadow: 0 2px 4px rgba(0,0,0,.95), 0 0 12px rgba(240,140,40,.8); }
.plate .bar { height: 8px; margin: 4px auto 0; width: 120px; }
.plate .bar.mp { height: 4px; margin-top: 2px; }
.plate .fx { display: flex; justify-content: center; gap: 7px; height: 12px; margin-top: 6px; }
.plate .fx i { width: 8px; height: 8px; transform: rotate(45deg); background: var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.8), 0 0 6px var(--c); }

/* --- kit parçaları --- */
.k { font: 600 13px var(--cin); letter-spacing: .24em; text-transform: uppercase; color: rgba(var(--gold), .85); }
.n { font: 600 22px var(--cin); letter-spacing: .06em; color: var(--on); text-transform: uppercase; }
.m { font: italic 17px var(--gar); color: var(--muted); }
.dia { display: inline-block; width: 10px; height: 10px; transform: rotate(45deg); background: var(--ember); box-shadow: 0 0 0 1px var(--ember2), 0 0 10px rgba(240,140,40,.6); flex: none; }
.dia.h { background: rgba(8,6,4,.6); box-shadow: 0 0 0 1px rgba(var(--gold), .55); }
.dia.s { width: 7px; height: 7px; }
.fade { height: 1px; flex: none; background: linear-gradient(90deg, rgba(var(--gold),0), rgba(var(--gold),.55) 25%, rgba(var(--gold),.55) 75%, rgba(var(--gold),0)); }
.fade.l { background: linear-gradient(90deg, rgba(var(--gold),.5), rgba(var(--gold),.3) 60%, rgba(var(--gold),0)); }
.vfade { width: 1px; flex: none; align-self: stretch; background: linear-gradient(180deg, rgba(var(--gold),0), rgba(var(--gold),.34) 25%, rgba(var(--gold),.34) 75%, rgba(var(--gold),0)); }
.hd { display: flex; align-items: center; gap: 9px; padding-bottom: 6px; margin-bottom: 6px; font: 600 12px var(--cin); letter-spacing: .26em; text-transform: uppercase; color: rgba(var(--gold), .82); border-bottom: 1px solid rgba(var(--gold), .16); }
.panel { position: relative; background: linear-gradient(180deg, rgba(30,22,14,.96), rgba(12,9,6,.97)); border: 1px solid rgba(var(--gold), .42); box-shadow: 0 0 0 3px rgba(8,6,4,.7), 0 18px 40px rgba(0,0,0,.6); }
.panel.corners::before, .panel.corners::after { content: ''; position: absolute; top: -5px; width: 9px; height: 9px; transform: rotate(45deg); background: #140e09; box-shadow: 0 0 0 1px rgba(var(--gold), .7); }
.panel.corners::before { left: -5px; } .panel.corners::after { right: -5px; }
.bar { position: relative; height: 10px; background: rgba(0,0,0,.65); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(var(--gold), .12); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; }
.bar.hp i { background: linear-gradient(180deg, #7ad987, #3e9a4c); }
.bar.hpE i { background: linear-gradient(180deg, #f07a6c, #b83a30); }
.bar.mp i { background: linear-gradient(180deg, #78a8ff, #3566cc); }
.num { font: 700 17px var(--num); color: #f4ede1; text-shadow: 0 2px 3px rgba(0,0,0,.9); white-space: nowrap; }
[data-tip] { cursor: help; }

.tbar { position: relative; height: 17px; background: rgba(0,0,0,.7); box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(var(--gold), .18); }
.tbar i { position: absolute; left: 1px; top: 1px; bottom: 1px; }
.tbar.hp i { background: linear-gradient(180deg, #6cc97a, #2f7d3c); }
.tbar.mp i { background: linear-gradient(180deg, #6c98f0, #2c55aa); }
.tbar span { position: relative; display: block; text-align: center; font: 700 14px/17px var(--num); color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
/* --- sağ üst --- */
.tr { position: absolute; top: 14px; right: 24px; display: flex; align-items: center; gap: 10px; z-index: 3000; }
.menu-link { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; font: 600 20px var(--cin); letter-spacing: .16em; color: var(--txt); text-shadow: 0 2px 6px rgba(0,0,0,.9); position: relative; cursor: pointer; transition: color .18s, text-shadow .18s; }
.menu-link:hover { color: var(--on); text-shadow: 0 0 14px rgba(240,140,40,.85); }
.menu-link::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 10px; height: 1px; background: linear-gradient(90deg, rgba(var(--gold),0), rgba(var(--gold),.6) 30%, rgba(var(--gold),.6) 70%, rgba(var(--gold),0)); }
.fs-ico { width: 56px; height: 56px; display: grid; place-items: center; position: relative; color: var(--txt); }
.fs-ico::before { content: ''; position: absolute; inset: 10px; border: 1px solid rgba(var(--gold), .42); background: rgba(8,6,4,.45); }
.fs-ico svg { position: relative; width: 20px; height: 20px; }

/* --- sıra çubuğu: tam ortada, şu anki birim tam ortada --- */
.turn { position: absolute; top: 18px; height: 92px; display: flex; gap: 10px; align-items: center; z-index: 3000; }
.turn::before { content: ''; position: absolute; left: -60px; right: -60px; top: 50%; height: 1px; background: linear-gradient(90deg, rgba(var(--gold),0), rgba(var(--gold),.45) 15%, rgba(var(--gold),.45) 85%, rgba(var(--gold),0)); z-index: -1; }
.cell { position: relative; width: 70px; height: 70px; background: linear-gradient(180deg, #22180f, #0a0705); box-shadow: inset 0 0 0 1px rgba(var(--gold), .45), 0 0 0 3px rgba(8,6,4,.7); flex: none; transition: transform .18s var(--ease); }
.cell:hover { transform: translateY(-2px); }
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell.enemy img { transform: scaleX(-1); }
.cell::after { content: ''; position: absolute; inset: 4px; box-shadow: inset 0 0 0 1px var(--side, var(--party)); opacity: .7; }
.cell.enemy { --side: var(--enemy); }
.cell.past { opacity: .42; filter: grayscale(.75); }
.cell.now { width: 92px; height: 92px; box-shadow: inset 0 0 0 2px var(--on), 0 0 0 3px rgba(8,6,4,.8), 0 0 24px rgba(240,140,40,.5); }
.turn-lbl { position: absolute; top: 118px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; font: 600 15px var(--cin); letter-spacing: .3em; color: var(--on); text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 0 14px rgba(240,140,40,.5); white-space: nowrap; z-index: 3000; }
.turn-side { position: absolute; top: 50px; font: italic 15px var(--gar); color: var(--dim); text-shadow: 0 2px 4px #000; z-index: 3000; transform: translateY(-50%); }

/* --- alt bant --- */
.band { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(22,16,11,.95), rgba(7,5,4,.985) 70%); z-index: 2900; }
.band::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 1px; background: linear-gradient(90deg, rgba(var(--gold),.12), rgba(var(--gold),.6) 50%, rgba(var(--gold),.12)); }
.band::after { content: ''; position: absolute; left: 0; right: 0; top: -26px; height: 26px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.4)); }
.band .cd { position: absolute; top: -5px; left: 50%; margin-left: -5px; }
.hud { position: absolute; z-index: 3100; }

/* --- skill: kutusuz çerçeveli ikon + ad + bedel; açıklama hemen üstünde --- */
.skills { display: flex; gap: 12px; }
.sk { position: relative; width: 146px; display: flex; flex-direction: column; align-items: center; gap: 7px; padding-top: 8px; cursor: pointer; }
.sk .fr { position: relative; width: 78px; height: 78px; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, rgba(46,33,20,.95), rgba(10,7,5,.97) 75%); box-shadow: inset 0 0 0 1px rgba(var(--gold), .45), 0 0 0 3px rgba(8,6,4,.75); transition: box-shadow .2s, transform .25s var(--ease); }
.sk .fr::before, .sk .fr::after { content: ''; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; transform: rotate(45deg); background: #1a130c; box-shadow: 0 0 0 1px rgba(var(--gold), .45); transition: background .2s, box-shadow .2s; }
.sk .fr::before { left: -5px; } .sk .fr::after { right: -5px; }
.sk .fr .ico { width: 62px; height: 62px; }
.sk .key { position: absolute; left: 5px; top: 2px; font: 700 13px var(--num); color: var(--dim); text-shadow: 0 1px 2px #000; }
.sk .nm { font: 600 15px var(--cin); letter-spacing: .08em; text-transform: uppercase; color: var(--txt); white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,.9); transition: color .18s, text-shadow .18s; }
.sk .cost { display: flex; gap: 12px; align-items: center; height: 18px; font: 700 16px var(--num); color: #f4ede1; }
.sk .cost span { display: flex; align-items: center; gap: 4px; }
.sk .cost .ico { width: 17px; height: 17px; }
.sk .cost .free { font: italic 16px var(--gar); color: var(--dim); }
.sk:hover .fr { transform: translateY(-3px); box-shadow: inset 0 0 0 1px rgba(243,217,153,.9), 0 0 0 3px rgba(8,6,4,.75), 0 0 16px rgba(240,140,40,.25); }
.sk:hover .fr::before, .sk:hover .fr::after { background: var(--ember); box-shadow: 0 0 0 1px var(--ember2); }
.sk:hover .nm { color: var(--on); }
.sk.sel .fr { box-shadow: inset 0 0 0 2px var(--on), 0 0 0 3px rgba(8,6,4,.75), 0 0 26px rgba(240,140,40,.5); }
.sk.sel .fr::before, .sk.sel .fr::after { background: var(--ember); box-shadow: 0 0 0 1px var(--ember2), 0 0 8px rgba(240,140,40,.8); }
.sk.sel .nm { color: var(--on); text-shadow: 0 0 12px rgba(240,140,40,.8), 0 2px 4px #000; }
.sk::after { content: ''; position: absolute; left: 50%; bottom: -10px; width: 30px; height: 1px; transform: translateX(-50%) scaleX(0); background: var(--ember2); box-shadow: 0 0 8px rgba(240,140,40,.9); transition: transform .25s var(--ease); }
.sk.sel::after { transform: translateX(-50%) scaleX(1); }
.sk.ult .fr { box-shadow: inset 0 0 0 1px rgba(255,190,110,.75), 0 0 0 3px rgba(8,6,4,.75); }
.sk.cdn .fr .ico { filter: grayscale(.85) brightness(.45); }
.sk .cdv { position: absolute; inset: 0; display: grid; place-items: center; font: 600 30px var(--cin); color: var(--on); text-shadow: 0 2px 6px #000, 0 0 12px rgba(240,140,40,.6); }
.sk.cdn .nm { color: var(--dim); }
.sk .tip { position: absolute; bottom: calc(100% + 18px); left: 50%; width: 430px; padding: 14px 18px 14px; text-align: left; cursor: default; z-index: 5; opacity: 0; visibility: hidden; transform: translate(-50%, 6px); transition: opacity .18s, transform .22s var(--ease), visibility 0s .2s; pointer-events: none; }
.sk .tip::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 14px; transform: translateX(-50%) rotate(45deg); background: #0f0b07; border-right: 1px solid rgba(var(--gold), .42); border-bottom: 1px solid rgba(var(--gold), .42); }
.sk:hover .tip, .sk.sel .tip { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .18s, transform .22s var(--ease); }
.skills:has(.sk:hover) .sk.sel:not(:hover) .tip { opacity: 0; visibility: hidden; }
.tip .t { display: flex; align-items: center; gap: 12px; }
.tip .t .ico { width: 40px; height: 40px; }
.tip .tag { margin-left: auto; font: 600 11px var(--cin); letter-spacing: .16em; text-transform: uppercase; color: var(--on); border: 1px solid rgba(var(--gold), .55); padding: 3px 8px; white-space: nowrap; }
.tip p { margin: 9px 0 0; font: 18px/1.28 var(--gar); color: var(--note); }
.tip .meta { display: flex; gap: 18px; margin-top: 9px; font: 700 16px var(--num); color: #f4ede1; }
.tip .meta span { display: flex; gap: 5px; align-items: center; }
.tip .meta .ico { width: 17px; height: 17px; }
.tip .meta em { font: italic 16px var(--gar); color: var(--muted); }

/* --- global eylemler: skill'lerin hemen sağında dikey sütun, kutusuz yazı düğmeleri --- */
.globs { display: flex; flex-direction: column; gap: 2px; }
.gl { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px 0 2px; cursor: pointer; font: 600 15px var(--cin); letter-spacing: .14em; text-transform: uppercase; color: var(--txt); text-shadow: 0 2px 4px rgba(0,0,0,.9); white-space: nowrap; transition: color .18s, text-shadow .18s; }
.gl::before { content: ''; width: 8px; height: 8px; flex: none; transform: rotate(45deg) scale(.4); background: var(--ember); box-shadow: 0 0 0 1px var(--ember2); opacity: 0; transition: opacity .18s, transform .18s var(--ease); }
.gl .ico { width: 26px; height: 26px; transition: transform .18s var(--ease); }
.gl > span { transition: transform .18s var(--ease); }
.gl:hover { color: var(--on); text-shadow: 0 0 14px rgba(240,140,40,.85); }
.gl:hover::before { opacity: 1; transform: rotate(45deg) scale(1); }
.gl:hover > span, .gl:hover .ico { transform: translateX(3px); }
.gl small { font: italic 14px var(--gar); letter-spacing: 0; text-transform: none; color: var(--dim); }

/* --- sağ blok: pasif + primary bonus --- */
.side { display: flex; flex-direction: column; gap: 10px; }
.pas { display: flex; gap: 12px; align-items: center; }
.pas .t { font: 600 16px var(--cin); letter-spacing: .06em; color: var(--on); text-transform: uppercase; }
.pas .d { font: italic 16px/1.2 var(--gar); color: var(--note); }
.medal { border-radius: 50%; display: grid; place-items: center; background: radial-gradient(#2a1d12, #0c0906); box-shadow: inset 0 0 0 1.5px rgba(var(--gold), .65), 0 0 0 3px rgba(10,7,5,.75); flex: none; }

/* --- stat parçaları --- */
.st { display: flex; align-items: center; gap: 7px; font: 700 18px var(--num); color: #f4ede1; white-space: nowrap; text-shadow: 0 2px 3px rgba(0,0,0,.9); transition: color .15s; }
.st .ico { width: 19px; height: 19px; }
.st .l { font: 600 12px var(--cin); letter-spacing: .1em; color: var(--muted); }
.st.pri { color: var(--pri); }
.st.pri .l { color: #e8c47e; }
.st:hover, .st:hover .l { color: var(--on); }
.row { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 8px; height: 20px; }
.row .l { font: 600 12px var(--cin); letter-spacing: .1em; color: var(--muted); }
.row .v { font: 700 17px var(--num); color: #f4ede1; text-align: right; text-shadow: 0 2px 3px #000; }
.row.pri .l { color: #e8c47e; } .row.pri .v { color: var(--pri); }
.row:hover .l, .row:hover .v { color: var(--on); }
.row .ico { width: 18px; height: 18px; }

/* --- kayan tooltip (stat / global / sıra) --- */
#ftip { position: absolute; z-index: 5000; max-width: 400px; padding: 12px 16px 12px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .2s var(--ease); }
#ftip.on { opacity: 1; transform: none; }
#ftip .tt { display: flex; align-items: center; gap: 10px; font: 600 17px var(--cin); letter-spacing: .06em; text-transform: uppercase; color: var(--on); }
#ftip .tt .ico { width: 24px; height: 24px; }
#ftip .tt .v { margin-left: auto; font: 700 19px var(--num); color: #f4ede1; letter-spacing: 0; padding-left: 14px; }
#ftip .tt .v.pri { color: var(--pri); }
#ftip ul { margin: 8px 0 0; padding: 0; list-style: none; }
#ftip li { position: relative; padding-left: 16px; font: 17px/1.25 var(--gar); color: var(--note); margin-top: 3px; }
#ftip li::before { content: ''; position: absolute; left: 1px; top: 8px; width: 5px; height: 5px; transform: rotate(45deg); background: rgba(var(--gold), .6); }
#ftip .bn { margin-top: 8px; padding-top: 7px; border-top: 1px solid rgba(var(--gold), .16); font: italic 16px/1.22 var(--gar); color: var(--pri); }
#ftip .fx { margin-top: 7px; font: italic 15px var(--gar); color: var(--dim); }

/* --- birim kartı (düşman / dost) --- */
.ucard { position: absolute; top: 172px; width: 384px; padding: 16px 18px 14px; z-index: 4000; opacity: 0; visibility: hidden; transform: translateY(8px); transition: opacity .18s, transform .22s var(--ease), visibility 0s .2s; pointer-events: none; }
.ucard.on { opacity: 1; visibility: visible; transform: none; transition: opacity .18s, transform .22s var(--ease); }
.ucard.pin { pointer-events: auto; }
.ucard .hdr { display: flex; gap: 14px; align-items: center; }
.ucard .hdr .cell { width: 66px; height: 66px; }
.ucard .side-tag { margin-left: auto; align-self: flex-start; font: 600 11px var(--cin); letter-spacing: .18em; padding: 3px 8px; border: 1px solid; }

// ---------------------------------------------------------------- veri (gerçek değerler: data/classes/*.json + data/formulas.json)
const I = (n) => `battle-hud/icons/${n}.png`;
const F = { hpBase: 30, hpPerStr: 6, mpBase: 30, mpPerInt: 2, spdBase: 7, spdPerDex: 0.4, critBase: 5, critPerLuck: 0.5, accBase: 80, accPerLuck: 1, evaStep: 5, evaPer: 2, evaMax: 75, k: 30 };
const CLS = {
  warrior: { name: 'Warrior', role: 'Melee Bruiser', a: { str: 15, int: 8, dex: 4, luck: 3 }, pri: 'str', armor: 9, mArmor: 0, passive: ['Berserker', 'The lower its HP, the harder it hits: up to +80% damage at the brink of death.'] },
  defender: { name: 'Defender', role: 'Tank', a: { str: 15, int: 10, dex: 3, luck: 2 }, pri: 'str', armor: 19, mArmor: 0, passive: ['Bulwark Aura', 'It and the allies right next to it gain armor equal to 40% of its own.'] },
  cutthroat: { name: 'Cutthroat', role: 'Assassin', a: { str: 5, int: 5, dex: 15, luck: 5 }, pri: 'dex', armor: 5, mArmor: 0, passive: ['Opportunist', '+25% damage against Wounded, Slowed, Stunned or Withering targets.'] },
  undead: { name: 'Undead', role: 'Dark Mage', a: { str: 12, int: 14, dex: 2, luck: 2 }, pri: 'int', armor: 8, mArmor: 0, passive: ['Vampiric Bite', 'Drains 35% of the damage it deals as health.'] },

};
function derive(c) {
  const a = c.a;
  return { hp: F.hpBase + F.hpPerStr * a.str, mp: F.mpBase + F.mpPerInt * a.int, spd: +(F.spdBase + F.spdPerDex * a.dex).toFixed(1), crit: F.critBase + F.critPerLuck * a.luck, acc: F.accBase + F.accPerLuck * a.luck, eva: Math.min(F.evaMax, Math.floor(a.dex / F.evaStep) * F.evaPer), red: c.armor / (c.armor + F.k) };

  fortify: { n: 'Fortified', c: '#c58bff', d: 'Damage taken −50%' },

  { cls: 'undead', side: 'enemy', slot: [1380, 842], hp: 102, mp: 58 },

const ACTIVE = UNITS[1];
// sıra: 4 geçmiş + şu an + 4 sıradaki => şu anki birim çubuğun ve ekranın tam ortasında

  dex: { l: 'DEX', n: 'Dexterity', v: 7, d: ['Speed +0.4 per point (now 9.8)', 'Evasion +2% per 5 Dexterity (now 2%)', 'Dexterity skills scale with DEX'] },
  int: { l: 'INT', n: 'Intelligence', v: 3, d: ['Max MP +2 per point (now 36)', 'MP regen +0.33 per point (now 1 a turn)', 'Magic damage, heals and wards scale with INT'] },
  luck: { l: 'LCK', n: 'Luck', v: 12, p: 1, d: ['Crit chance +0.5% per point (now 11%)', 'Accuracy +1% per point (now 92%)', 'Every Gambler skill scales with Luck'], bn: 'Primary · Lucky Escape: once per battle, 30% chance to ignore a killing blow.' },
  critChance: { l: 'CRIT', n: 'Crit chance', v: '11%', d: ['Chance that a hit or heal is critical', 'Base 5%, +0.5% per Luck'] },
  critMult: { l: 'CDMG', n: 'Crit damage', v: '×1.5', d: ['A crit multiplies the final damage or healing by ×1.5', 'Fixed for every unit; never applies to shields'] },

  hpRegen: { l: 'HP+', n: 'HP regen', v: 2, d: ['Restores 2 HP at the start of each of your turns', 'Strength × 0.25'] },

const ATK = ['critChance', 'critMult', 'accuracy', 'spd'];
const DEF = ['armor', 'magicArmor', 'evasion', 'hpRegen', 'mpRegen'];
const GROUPS = [['Main', MAIN], ['Attack', ATK], ['Defense', DEF]];

    <path d="${arc(80, -80, R)}" stroke="rgba(0,0,0,.7)" stroke-width="7" fill="none"/><path d="${arc(80, 80 - 160 * mpF, R)}" stroke="#5a8ff0" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  const orbit = r + 50;
  const chip = (k, ang) => { const t = ST[k], a = (ang * Math.PI) / 180; return `<div class="chipr ${t.p ? 'pri' : ''}" ${tipAttr('s:' + k)} style="left:${r + orbit * Math.cos(a)}px;top:${r + orbit * Math.sin(a)}px"><img class="ico" src="${I('stat_' + k)}">${t.v}<span class="cl">${t.l}</span></div>`; };
  s += `<div class="mdl ${S.open ? 'open' : ''}" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px">${svg}
    <div class="face" data-open="1" style="left:0;top:0;width:${2 * r}px;height:${2 * r}px"><img src="battle-hud/img/av-gambler.webp"></div>
    ${[['str', -125], ['dex', -86], ['int', -47], ['luck', -8]].map(([k, a]) => chip(k, a)).join('')}</div>`;
  const ch = (k) => { const t = ST[k]; return `<div class="chipr ${t.p ? 'pri' : ''}" ${tipAttr('s:' + k)}><img class="ico" src="${I('stat_' + k)}">${t.v}<span class="cl">${t.l}</span></div>`; };
  s += `<div class="reveal panel corners" style="left:24px;bottom:${1080 - (cy - r - 70)}px;--ox:${cx - 24}px;--oy:calc(100% + ${cy - (cy - r - 70)}px)">
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px"><span class="n" style="font-size:20px">Gambler</span><span class="m">Risk Taker · Luck primary</span></div>
    ${GROUPS.map(([t, ks]) => `<div class="rg"><span class="k">${t}</span><div class="chips">${ks.map(ch).join('')}</div></div>`).join('')}</div>`;
  s += `<div class="hud" style="left:${cx + r + 96}px;top:${y + 26}px;display:flex;flex-direction:column;gap:10px">${nameLine(21)}
    <div style="display:flex;gap:22px">${['hp', 'mp'].map((k) => `<div class="num" ${tipAttr('s:' + k)} style="display:flex;align-items:center;gap:6px;${k === 'mp' ? 'color:#9cc4ff' : ''}"><img class="ico" src="${I('stat_' + k)}" style="width:18px;height:18px">${k === 'hp' ? ACTIVE.hp : ACTIVE.mp}<span style="color:var(--muted);font-size:14px">/ ${k === 'hp' ? G.hp : G.mp}</span></div>`).join('')}</div>
    <span class="more" data-open="1" style="cursor:pointer">All stats</span></div>`;
  s += c.html + sideBlock(c.right + 30, y + 16, Math.min(400, S.W - c.right - 80));
  return s;
} };

// ---------------------------------------------------------------- birim kartı
function cardHtml(i) {
  const u = UNITS[i], c = u.c, d = u.d, en = u.side === 'enemy';
  const attr = ['str', 'dex', 'int', 'luck'].map((k) => `<div class="st ${c.pri === k ? 'pri' : ''}" style="font-size:17px"><img class="ico" src="${I('stat_' + k)}" style="width:17px;height:17px"><span class="l">${ST[k].l}</span><span>${c.a[k]}</span></div>`).join('');
  const r = (k, v, sm = '') => `<div class="row"><img class="ico" src="${I('stat_' + k)}"><span class="l">${ST[k].l}</span><span class="v">${v}${sm ? `<small>${sm}</small>` : ''}</span></div>`;
  const grid = [r('armor', c.armor, `−${Math.round(d.red * 100)}%`), r('evasion', d.eva + '%'), r('spd', d.spd), r('magicArmor', c.mArmor), r('critChance', d.crit + '%'), r('accuracy', d.acc + '%')].join('');
  const fx = (u.fx || []).map(([k, t]) => `<div class="e" style="--c:${STATUS[k].c}"><i></i><b>${STATUS[k].n}<em>${t}</em></b><span>${STATUS[k].d}</span></div>`).join('');
  let pv = '';
  const sk = SKILLS.find((s) => s.id === S.sel);
  if (en && sk && !sk.cdNow) {
    const hit = Math.max(0, Math.min(100, G.acc - d.eva));
    const base = ACTIVE.c.a.luck * sk.power * (1 - d.red) * (u.fx?.some(([k]) => k === 'fortify') ? 0.5 : 1);
    pv = `<div class="pv"><img class="ico" src="${I('skill_' + sk.id)}"><b>${sk.name.toUpperCase()}</b><span style="margin-left:auto">${hit}%<em> to hit</em></span><span>${Math.round(base * 0.9)}–${Math.round(base * 1.1)}<em> dmg</em></span></div>`;
  }
  return `<div class="hdr"><div class="cell ${en ? 'enemy' : ''}"><img src="battle-hud/img/av-${u.cls}.webp"></div>
      <div><div class="n" style="font-size:21px">${c.name}</div><div class="m" style="font-size:16px">${c.role} · ${ST[c.pri].l} primary</div></div><span class="side-tag">${en ? 'ENEMY' : 'ALLY'}</span></div>
    <div class="bars"><div><div class="lab"><span><img class="ico" src="${I('stat_hp')}">${u.hp}</span><span style="color:var(--muted);font-size:14px">/ ${d.hp}</span></div>${bar(en ? 'hpE' : 'hp', u.hp, d.hp)}</div>
      <div><div class="lab"><span style="color:#9cc4ff"><img class="ico" src="${I('stat_mp')}">${u.mp}</span><span style="color:var(--muted);font-size:14px">/ ${d.mp}</span></div>${bar('mp', u.mp, d.mp)}</div></div>
    <div class="attrs">${attr}</div>
    <div class="fade" style="margin:10px 0 8px"></div><div class="grid">${grid}</div>
    ${fx ? `<div class="sec"><div class="hd"><i class="dia h s"></i>Effects</div><div class="eff">${fx}</div></div>` : ''}
    <div class="sec"><div class="hd"><i class="dia h s"></i>Passive</div><div style="font:600 14px var(--cin);letter-spacing:.06em;color:var(--on);text-transform:uppercase">${c.passive[0]}</div><div style="font:italic 16px/1.2 var(--gar);color:var(--note)">${c.passive[1]}</div></div>
    ${pv}${pinOf(u.side) === i ? '<div class="hint">Pinned · click the unit again or press Esc</div>' : ''}`;
}
const pinOf = (side) => (side === 'party' ? S.pinL : S.pinR);
function setPin(side, i) { if (side === 'party') S.pinL = i; else S.pinR = i; }
/** İki kart: dost solda, düşman sağda. Her tarafta bir sabit kart; hover kendi tarafında önizler, öbür tarafın sabitine dokunmaz. */
function updateCard() {
  const lit = new Set([S.hov, S.pinL, S.pinR].filter((i) => i >= 0));
  stage.querySelectorAll('[data-u]').forEach((e) => e.classList.toggle('hov', lit.has(Number(e.dataset.u))));
  for (const side of ['party', 'enemy']) {
    const card = document.getElementById(side === 'party' ? 'ucardL' : 'ucardR');
    const hv = S.hov >= 0 && UNITS[S.hov].side === side ? S.hov : -1;
    const pin = pinOf(side);
    const i = hv >= 0 ? hv : pin;
    if (i < 0) { card.classList.remove('on', 'pin'); continue; }
    card.className = `ucard panel corners on ${side} ${pin === i ? 'pin' : ''}`;
    const key = `${i}|${S.sel}|${pin === i}`;
    if (card.dataset.k !== key) { card.innerHTML = cardHtml(i); card.dataset.k = key; }
    card.style.left = (side === 'enemy' ? S.W - 384 - 40 : S.v === 4 ? 200 : 28) + 'px';
  }
}

// ---------------------------------------------------------------- kayan tooltip
function tipHtml(key) {
  const [kind, id, extra] = key.split(':');
  if (kind === 's') {
    const s = ST[id];
    const grp = GROUPS.find(([, ks]) => ks.includes(id));
    return `<div class="tt"><img class="ico" src="${I('stat_' + id)}">${s.n}<span class="v ${s.p ? 'pri' : ''}">${s.v}</span></div><ul>${s.d.map((l) => `<li>${l}</li>`).join('')}</ul>${s.bn ? `<div class="bn">${s.bn}</div>` : ''}${extra === 'r' && grp ? `<div class="fx">${grp[0]} stat · see Codex › Stats</div>` : ''}`;
  }
  if (kind === 'p') {
    const p = CLS.gambler.passive;
    if (id === 'passive') return `<div class="tt"><img class="ico" src="${I('passive_gambler')}">${p[0]}<span class="v" style="font:italic 15px var(--gar);color:var(--muted)">passive</span></div><ul><li>${p[1]}</li></ul>`;
    return `<div class="tt"><i class="dia" style="background:var(--pri);margin:0 6px"></i>Lucky Escape<span class="v" style="font:600 11px var(--cin);letter-spacing:.16em;color:var(--pri)">READY</span></div><ul><li>Once per battle, a killing blow has a 30% chance to be ignored completely</li><li>Luck primary bonus: active while Luck is your highest stat</li></ul>`;
  }
  if (kind === 'g') {
    const g = GLOBALS.find((x) => x.id === id);
    return `<div class="tt"><img class="ico" src="${I(g.ic)}">${g.n === 'Skip' ? 'Skip turn' : g.n}<span class="v" style="font:italic 15px var(--gar);color:var(--muted)">global action</span></div><ul>${g.d.map((l) => `<li>${l}</li>`).join('')}</ul>`;
  }
  if (kind === 'q') {
    const u = UNITS[Number(id)];
    const when = extra === 'past' ? 'Already acted this round' : extra === 'now' ? 'Acting now' : `Acts in ${extra.slice(1)} turn${extra === 'n1' ? '' : 's'}`;
    return `<div class="tt" style="font-size:16px">${u.c.name}<span class="v" style="font:600 11px var(--cin);letter-spacing:.16em;color:${u.side === 'enemy' ? '#ffb0a0' : '#b8d8ff'}">${u.side === 'enemy' ? 'ENEMY' : 'ALLY'}</span></div><div class="fx" style="margin-top:3px">${when}</div>`;
  }
  return '';
}
let tipEl = null, tipPinned = false;
function showTip(el) {
  const ft = document.getElementById('ftip');
  ft.innerHTML = tipHtml(el.dataset.tip);
  ft.classList.add('on');
  const sr = stage.getBoundingClientRect(), r = el.getBoundingClientRect();
  const ex = (r.left - sr.left) / S.sc, ey = (r.top - sr.top) / S.sc, ew = r.width / S.sc, eh = r.height / S.sc;
  const tw = ft.offsetWidth, th = ft.offsetHeight;
  let x, y;
  if (el.dataset.tip.endsWith(':r')) { x = ex + ew + 18; y = ey + eh / 2 - th / 2; }
  else { x = ex + ew / 2 - tw / 2; y = ey - th - 12; if (y < 10) y = ey + eh + 12; }
  ft.style.left = Math.max(12, Math.min(S.W - tw - 12, x)) + 'px';
  ft.style.top = Math.max(10, Math.min(1080 - th - 10, y)) + 'px';
  tipEl = el;
}
function hideTip() { document.getElementById('ftip')?.classList.remove('on'); tipEl = null; tipPinned = false; S.demoTip = ''; }

// ---------------------------------------------------------------- çizim, olaylar, ölçek
const stage = document.getElementById('stage');
function render() {
  document.getElementById('pick').innerHTML = [1, 2, 3, 4, 5].map((i) => `<button class="${S.v === i ? 'on' : ''}" data-v="${i}" title="${V[i].name}">${i}</button>`).join('') + '<button class="tog" data-tog="1" title="Hide / show">◐</button>';
  document.getElementById('cap').innerHTML = `<b>${S.v} · ${V[S.v].name}</b>${V[S.v].cap}`;
  if (S.v === 2) document.getElementById('pick').innerHTML += '<div class="sep"></div>' + ['a', 'b', 'c', 'd'].map((b) => `<button class="br ${S.br === b ? 'on' : ''}" data-br="${b}" title="${BR[b].name}">${b}</button>`).join('');
  if (S.v === 2) document.getElementById('cap').innerHTML += `<b style="margin-top:8px">Bottom right ${S.br} · ${BR[S.br].name}</b>${BR[S.br].cap}`;
  stage.innerHTML = scene() + turnBar() + topRight() + V[S.v].html() + '<div id="ucardL" class="ucard panel corners"></div><div id="ucardR" class="ucard panel corners"></div><div id="ftip" class="panel"></div>';
  tipEl = null; tipPinned = false;
  stage.classList.toggle('is-open', S.open);
  updateCard();
  if (S.demoTip) { const el = stage.querySelector(`[data-tip="${S.demoTip}"]`); if (el) requestAnimationFrame(() => { showTip(el); tipPinned = true; }); }
}
document.getElementById('pick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tog) { document.getElementById('pick').classList.toggle('min'); return; }
  if (b.dataset.br) S.br = b.dataset.br; else S.v = Number(b.dataset.v);
  S.open = false; S.log = false; S.hov = -1;
  history.replaceState(null, '', `?v=${S.v}${S.v === 2 ? `&br=${S.br}` : ''}`);
  render();
});
function setOpen(v) {
  S.open = v;
  stage.classList.toggle('is-open', v);
  stage.querySelectorAll('.opener, .cg, .mdl').forEach((e) => e.classList.toggle('open', v));
  stage.querySelectorAll('.reveal').forEach((e) => e.classList.toggle('open', v));
}
stage.addEventListener('pointerover', (e) => {
  if (e.pointerType === 'touch') return;
  const t = e.target.closest('[data-tip]');
  if (t && t !== tipEl) showTip(t);
  const u = e.target.closest('[data-u]');
  const i = u ? Number(u.dataset.u) : -1;
  if (i !== S.hov) { S.hov = i; updateCard(); }
});
stage.addEventListener('pointerout', (e) => {
  if (e.pointerType === 'touch' || tipPinned) return;
  const t = e.target.closest('[data-tip]');
  if (t && !t.contains(e.relatedTarget)) hideTip();
  const u = e.target.closest('[data-u]');
  if (u && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-u]'))) { S.hov = -1; updateCard(); }
});
stage.addEventListener('click', (e) => {
  const tp = e.target.closest('[data-tip]');
  const sk = e.target.closest('[data-skill]'), op = e.target.closest('[data-open]'), u = e.target.closest('[data-u]');
  if (e.target.closest('.sk .tip, .ucard.pin, .logp')) return;
  // dokunmatik: stat'a dokununca tooltip açılır / kapanır
  if (tp && !sk && !u) { if (tipEl === tp && tipPinned) hideTip(); else { showTip(tp); tipPinned = true; } if (!op || tp.dataset.solo) return; }
  else if (tipPinned) hideTip();
  if (sk) {
    S.sel = S.sel === sk.dataset.skill ? '' : sk.dataset.skill;
    stage.querySelectorAll('.sk').forEach((x) => x.classList.toggle('sel', x.dataset.skill === S.sel));
    updateCard(); return;
  }
  if (u) { const i = Number(u.dataset.u), side = UNITS[i].side; setPin(side, pinOf(side) === i ? -1 : i); updateCard(); return; }
  const lg = e.target.closest('[data-log]');
  if (lg) { setLog(!S.log); return; }
  if (op) { if (!e.target.closest('.sheet, .big')) setOpen(!S.open); return; }
  if (e.target.closest('.sheet, .big, .reveal')) return;
  if (S.open) setOpen(false);
  if (S.log) setLog(false);
});
function setLog(v) { S.log = v; stage.querySelectorAll('.loglink, .logp').forEach((x) => x.classList.toggle('open', v)); }
// Esc: sabit kartlar, sayfa, günlük ve tooltip kapanır
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  S.pinL = S.pinR = -1; S.hov = -1; updateCard(); hideTip();
  if (S.open) setOpen(false);
  if (S.log) setLog(false);
});
function fit() {
  const vw = innerWidth, vh = innerHeight;
  const W = Math.round(Math.min(2580, Math.max(1920, (vw / vh) * 1080)));
  const sc = Math.min(vw / W, vh / 1080);
  S.sc = sc;
  stage.style.width = W + 'px';
  stage.style.transform = `translate(${(vw - W * sc) / 2}px, ${(vh - 1080 * sc) / 2}px) scale(${sc})`;
  if (W !== S.W) { S.W = W; render(); }
}
addEventListener('resize', fit);
// kısa ekranda (telefon) taslak açıklaması kapalı başlar; ◐ ile açılır
if (innerHeight <= 500) document.getElementById('pick').classList.add('min');
fit();
render();
// önizleme için adres seçenekleri: &br=a|b|c|d (v2 sağ alt), &log=1 (br=c günlüğü), &card=6,2 (iki taraf sabit kart), &open=1 (stat sayfası açık), &card=6 (birim kartı sabit), &tip=s:luck (tooltip), &sel=card_trick
function demo() {
  const q = new URLSearchParams(location.search);
  if (q.get('sel') !== null) { S.sel = q.get('sel'); render(); }
  if (q.get('open')) setOpen(true);
  if (q.get('card')) { q.get('card').split(',').map(Number).forEach((i) => setPin(UNITS[i].side, i)); updateCard(); }
  if (q.get('log')) setLog(true);
  if (q.get('tip')) { S.demoTip = q.get('tip'); render(); }
}
document.fonts.load('600 32px Cinzel').finally(() => { render(); demo(); });
</script>
</body>
