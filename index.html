<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Embers" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Embers of Valdoria</title>
    <!-- Açılış yükleme ekranı (src/ui/boot-loader.ts): Phaser ve fontlardan önce görünsün diye düz HTML/CSS, satır içi. Tasarım kiti dili. -->
    <style>
      html, body { margin: 0; background: #0d0a07; }
      #boot { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 45%, #1a120b 0%, #0d0a07 60%, #050403 100%); color: #d9c8a2; font-family: Georgia, 'Palatino Linotype', serif;
        transition: opacity 0.4s ease; -webkit-user-select: none; user-select: none; }
      #boot.boot-off { opacity: 0; pointer-events: none; }
      #boot.boot-hidden { display: none; }
      #boot .boot-dia { width: 12px; height: 12px; transform: rotate(45deg); background: #e0702a; box-shadow: 0 0 0 1px #ffb35a, 0 0 14px rgba(240, 140, 40, 0.7);
        animation: boot-glow 1.6s ease-in-out infinite; }
      #boot .boot-title { font-size: clamp(22px, 5.2vmin, 46px); font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; text-align: center;
        background: linear-gradient(180deg, #fbe7b0 0%, #e6c27a 55%, #b88a42 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding: 0 16px; }
      #boot .boot-line { display: flex; align-items: center; gap: 10px; }
      #boot .boot-line i { display: block; width: clamp(40px, 12vmin, 110px); height: 1px; background: linear-gradient(90deg, transparent, rgba(217, 178, 106, 0.6)); }
      #boot .boot-line i:last-child { background: linear-gradient(270deg, transparent, rgba(217, 178, 106, 0.6)); }
      #boot .boot-line b { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid rgba(217, 178, 106, 0.8); }
      #boot .boot-bar { position: relative; width: clamp(180px, 42vmin, 360px); height: 2px; background: rgba(217, 178, 106, 0.16); margin-top: 6px; }
      #boot .boot-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(224, 112, 42, 0.8), #f3d999); transition: width 0.25s ease;
        box-shadow: 0 0 8px rgba(240, 140, 40, 0.6); }
      #boot .boot-meta { display: flex; gap: 14px; font-style: italic; font-size: clamp(13px, 2.6vmin, 18px); color: #a8977a; }
      #boot .boot-pct { color: #f3d999; font-style: normal; letter-spacing: 0.08em; }
      @keyframes boot-glow { 50% { box-shadow: 0 0 0 1px #ffb35a, 0 0 26px rgba(240, 140, 40, 0.9); } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-dia"></div>
      <div class="boot-title">Embers of Valdoria</div>
      <div class="boot-line"><i></i><b></b><i></i></div>
      <div class="boot-bar"><div class="boot-fill"></div></div>
      <div class="boot-meta"><span class="boot-label">Loading</span><span class="boot-pct">0%</span></div>
    </div>
    <div id="stage">
      <div id="game"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
